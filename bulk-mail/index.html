<title>一斉配信ファイル工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ground:#F2F4F2; --surface:#FFFFFF; --surface-2:#E9EDEA; --line:#D5DCD8;
  --ink:#16211D; --ink-2:#43524C; --muted:#6E7C76;
  --accent:#0F6E62; --accent-ink:#0B5048; --accent-soft:#DDEBE7;
  --warn:#9A6512; --warn-soft:#F6EBD4; --danger:#A5382A; --danger-soft:#F6E0DC;
  --shadow:0 1px 2px rgba(22,33,29,.06), 0 8px 24px -16px rgba(22,33,29,.35);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --surface:#18211E; --surface-2:#212B27; --line:#2E3A35;
    --ink:#E8EEEB; --ink-2:#BCC7C2; --muted:#8B9A94;
    --accent:#4FBFAC; --accent-ink:#8FD9CB; --accent-soft:#1B302C;
    --warn:#D9A94E; --warn-soft:#2E2718; --danger:#E08878; --danger-soft:#33201C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#18211E; --surface-2:#212B27; --line:#2E3A35;
  --ink:#E8EEEB; --ink-2:#BCC7C2; --muted:#8B9A94;
  --accent:#4FBFAC; --accent-ink:#8FD9CB; --accent-soft:#1B302C;
  --warn:#D9A94E; --warn-soft:#2E2718; --danger:#E08878; --danger-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:14px; line-height:1.7;
}
h1,h2,h3{margin:0; font-weight:700; text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace}

header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px clamp(14px,3vw,28px);
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{font-size:17px; letter-spacing:.02em}
.brand span{font-size:11px; color:var(--muted); letter-spacing:.14em}
.counts{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
  font-size:12px; font-weight:500; background:var(--surface-2); color:var(--ink-2); white-space:nowrap;
}
.pill.ok{background:var(--accent-soft); color:var(--accent-ink)}
.pill.bad{background:var(--danger-soft); color:var(--danger)}
.pill.own{background:var(--warn-soft); color:var(--warn)}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:8px;
  padding:8px 14px; cursor:pointer; font-weight:500;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,li:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08201C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#08201C}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.tiny{padding:4px 10px; font-size:12px; border-radius:7px}
.btn:disabled{opacity:.45; cursor:not-allowed}

main{
  display:grid; grid-template-columns:308px minmax(0,1fr); gap:18px;
  padding:18px clamp(14px,3vw,28px) 60px; align-items:start;
}
@media (max-width:960px){main{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.panel > .head{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line)}
.panel > .head h2{font-size:13.5px}
.panel > .head .sub{font-size:11px; color:var(--muted); margin-left:auto; letter-spacing:.05em}
.panel > .body{padding:14px; display:flex; flex-direction:column; gap:13px}
.rail{display:flex; flex-direction:column; gap:16px; position:sticky; top:74px}
@media (max-width:960px){.rail{position:static}}

/* 宛先リスト */
ul.list{list-style:none; margin:0; padding:6px; display:flex; flex-direction:column; gap:3px; max-height:46vh; overflow:auto}
@media (max-width:960px){ul.list{max-height:none}}
ul.list li{
  border-radius:8px; padding:8px 10px; cursor:pointer; display:grid;
  grid-template-columns:1fr auto; gap:2px 8px; border:1px solid transparent;
}
ul.list li:hover{background:var(--surface-2)}
ul.list li[aria-selected="true"]{background:var(--accent-soft); border-color:var(--accent)}
li .t{grid-column:1; grid-row:1; font-weight:500; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
li .s{grid-column:1 / -1; grid-row:2; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
li .tag{grid-column:2; grid-row:1; justify-self:end; font-size:10px; padding:1px 7px; border-radius:999px; background:var(--surface-2); color:var(--muted); align-self:center; white-space:nowrap}
li .tag.own{background:var(--warn-soft); color:var(--warn)}
li .tag.bad{background:var(--danger-soft); color:var(--danger)}
li[aria-selected="true"] .s{color:var(--accent-ink)}
.tmpl-item{border-bottom:1px solid var(--line); padding:6px}

.toolbar{display:flex; gap:7px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--line)}
.toolbar .spacer{margin-left:auto}

label.field{display:flex; flex-direction:column; gap:5px; min-width:0}
label.field > .lab{font-size:11px; letter-spacing:.09em; color:var(--muted); font-weight:500}
input[type=text],textarea,select{
  width:100%; background:var(--ground); border:1px solid var(--line); border-radius:7px; padding:8px 10px;
}
input:disabled,textarea:disabled{opacity:.65; cursor:default}
textarea{resize:vertical; min-height:210px; line-height:1.8}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.hint{font-size:11.5px; color:var(--muted)}
.hint code, code{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-family:"JetBrains Mono",monospace; font-size:11px}

.modebar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:9px 12px; border-radius:8px; background:var(--surface-2);
}
.modebar .txt{font-size:12px; color:var(--ink-2); margin-right:auto}
.preview{background:var(--ground); border:1px dashed var(--line); border-radius:7px; padding:12px; font-size:13px; max-height:340px; overflow:auto}
.preview .subj{font-weight:700; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--line)}
.preview .to{font-size:11.5px; color:var(--muted); margin-bottom:10px; line-height:1.6}
.empty{padding:34px 16px; text-align:center; color:var(--muted); font-size:13px}

.drop{
  display:flex; align-items:center; justify-content:center; text-align:center;
  border:2px dashed var(--line); border-radius:9px; padding:28px 16px; cursor:pointer;
  color:var(--muted); font-size:13px; background:var(--ground);
}
.drop:hover,.drop.over{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.maps{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px}
.maps select{padding:6px 8px; font-size:13px}
.impinfo{font-size:12px; color:var(--ink-2); background:var(--surface-2); border-radius:7px; padding:9px 11px}
dialog{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink);
  padding:0; width:min(620px,92vw); box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(10,16,14,.5)}
dialog .body{padding:16px; display:flex; flex-direction:column; gap:12px}
dialog textarea{min-height:170px}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--ink); color:var(--ground); padding:10px 18px; border-radius:999px;
  font-size:13px; box-shadow:var(--shadow); z-index:60;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<header>
  <div class="brand">
    <h1>一斉配信ファイル工房</h1>
    <span>BULK MAIL SHEET</span>
  </div>
  <div class="counts" id="counts"></div>
  <button class="btn ghost" id="themeBtn" title="テーマ切替">◐</button>
  <button class="btn primary" id="dlBtn">Excelをダウンロード</button>
</header>

<main>
  <div class="rail">
    <section class="panel">
      <div class="head"><h2>宛先</h2><span class="sub" id="listSub"></span></div>
      <div class="tmpl-item">
        <ul class="list" style="max-height:none;padding:0">
          <li id="tmplItem" role="option" tabindex="0">
            <span class="t">共通ひな形</span>
            <span class="tag" id="tmplTag">基準</span>
            <span class="s">個別に書いていない宛先に使われます</span>
          </li>
        </ul>
      </div>
      <ul class="list" id="list" role="listbox" aria-label="宛先リスト"></ul>
      <div class="toolbar">
        <button class="btn tiny" id="addBtn">＋ 宛先を追加</button>
        <button class="btn tiny" id="pasteBtn">まとめて追加</button>
        <button class="btn tiny" id="importBtn">Excel読込</button>
        <span class="spacer"></span>
        <button class="btn tiny ghost" id="dupBtn">複製</button>
        <button class="btn tiny ghost" id="delBtn">削除</button>
      </div>
    </section>

    <section class="panel">
      <div class="head"><h2>共通設定</h2><span class="sub">全行に反映</span></div>
      <div class="body">
        <label class="field">
          <span class="lab">CC（全通に入ります / C列・K列以降 / , 区切り）</span>
          <input type="text" id="commonCc" class="mono">
        </label>
        <label class="field">
          <span class="lab">BCC（D列 / , 区切り）</span>
          <input type="text" id="bcc" class="mono">
        </label>
        <label class="field">
          <span class="lab">添付ファイルパス（H列 / 既定値）</span>
          <input type="text" id="filepath" class="mono">
        </label>
        <label class="field">
          <span class="lab">To・Cc をつなぐ区切り文字</span>
          <select id="sep">
            <option value=";">セミコロン ;（元ファイルと同じ）</option>
            <option value=",">カンマ ,</option>
          </select>
        </label>
      </div>
    </section>
  </div>

  <section class="panel" id="editorPanel">
    <div class="head"><h2 id="edTitle">共通ひな形</h2><span class="sub" id="edSub"></span></div>
    <div class="body" id="editor"></div>
  </section>
</main>

<dialog id="importDlg">
  <div class="body">
    <h2 style="font-size:15px">Excelから取り込む</h2>
    <div id="impStep1">
      <p class="hint">作りかけのExcel・CSVをそのまま読み込めます。列の並びが違っても、次の画面でどの列が何かを指定できます。</p>
      <label class="drop" id="drop" style="margin-top:10px">
        ここに xlsx / csv をドラッグ、またはクリックして選択
        <input type="file" id="impFile" accept=".xlsx,.xlsm,.xls,.csv" hidden>
      </label>
    </div>
    <div id="impStep2" hidden>
      <div class="impinfo" id="impInfo"></div>
      <div class="maps" style="margin-top:12px">
        <label class="field"><span class="lab">シート</span><select id="mSheet"></select></label>
        <label class="field"><span class="lab">見出し行</span><select id="mHead"></select></label>
        <label class="field"><span class="lab">名前 → A列</span><select data-map="name"></select></label>
        <label class="field"><span class="lab">会社名 → I列</span><select data-map="company"></select></label>
        <label class="field"><span class="lab">To → B列</span><select data-map="to"></select></label>
        <label class="field"><span class="lab">件名 → E列（任意）</span><select data-map="subject"></select></label>
        <label class="field"><span class="lab">本文 → F/G列（任意）</span><select data-map="body"></select></label>
        <label class="field"><span class="lab">添付ファイルパス → H列（任意）</span><select data-map="filepath"></select></label>
      </div>
      <label class="field" style="margin-top:12px"><span class="lab">取り込み方法</span>
        <select id="mMode">
          <option value="append">いまの宛先リストに追加する</option>
          <option value="replace">いまの宛先リストを置き換える</option>
        </select></label>
      <p class="hint" id="impPreview" style="margin-top:10px"></p>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="impCancel">キャンセル</button>
      <button class="btn" id="impBack" hidden>ファイルを選び直す</button>
      <button class="btn primary" id="impOk" hidden>取り込む</button>
    </div>
  </div>
</dialog>

<dialog id="pasteDlg">
  <div class="body">
    <h2 style="font-size:15px">まとめて宛先を追加</h2>
    <p class="hint">1行につき <strong>名前 → To → 会社名</strong> の順（タブ区切り／カンマ区切り）。見出し行は自動で無視します。追加された宛先は、まず共通ひな形の文面を使います。CCは共通設定の「CC」が全通に入ります。</p>
    <textarea id="pasteArea" class="mono" placeholder="佐藤&#9;sato@example.co.jp&#9;有限会社フジタケ"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" id="pasteCancel">キャンセル</button>
      <button class="btn primary" id="pasteOk">追加する</button>
    </div>
  </div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const HEADERS = ["名前","To メールアドレス","Cc","Bcc","件名","本文記載内容","本文","ファイルパス","会社名","","CCアドレス→"];
const STORE = "bulkmail.v2";
const uid = () => "r" + Math.random().toString(36).slice(2, 10);

const state = {
  template: {
    subject: "リングロー サイトクローズと今年度のお礼",
    body: "{{会社名}}\n{{名前}} 様\n\nお世話になっております。リングローの内野でございます。\n\n表題の件、新入生向けPC販売サイトをクローズいたしましたのでお知らせいたします。\n改めまして展開ご協力いただきありがとうございました。\n\n引き続きどうぞよろしくお願い申し上げます。\n\n内野"
  },
  commonCc: "h_mori@ringrow.co.jp, k_takizawa@ringrow.co.jp",
  bcc: "",
  filepath: "",
  sep: ";",
  sel: "template",
  rows: [
    { id: uid(), name:"佐藤", to:"sato@example.co.jp", company:"有限会社フジタケ", subject:null, body:null, filepath:null },
    { id: uid(), name:"", to:"info@example.ac.jp", company:"神田外語学院", subject:null, body:null, filepath:null }
  ]
};

/* 保存データの読み込み（v1 からの移行を含む） */
try {
  const v2 = JSON.parse(localStorage.getItem(STORE) || "null");
  if (v2 && Array.isArray(v2.rows)) {
    Object.assign(state, v2);
    state.rows.forEach(r => { if (!r.id) r.id = uid(); });
  } else {
    const v1 = JSON.parse(localStorage.getItem("bulkmail.v1") || "null");
    if (v1 && Array.isArray(v1.rows)) {
      state.template = { subject: v1.subject || "", body: v1.body || "" };
      ["commonCc","bcc","filepath","sep"].forEach(k => { if (v1[k] != null) state[k] = v1[k]; });
      state.rows = v1.rows.map(r => ({ id: uid(), name:r.name||"", to:r.to||"", company:r.company||"", subject:null, body:null, filepath:null }));
    }
  }
} catch (e) { /* 読めないときは初期値のまま */ }

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

/* ---------- 共通ロジック ---------- */
const splitAddrs = (s) => (s || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
const isMail = (a) => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(a);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const merge = (tpl, row) => (tpl || "")
  .replace(/\{\{\s*会社名\s*\}\}/g, row.company || "")
  .replace(/\{\{\s*名前\s*\}\}/g, row.name || "");
const rowCc = () => splitAddrs(state.commonCc);
const badAddrs = (row) => [...splitAddrs(row.to), ...rowCc()].filter(a => !isMail(a));
const isOwn = (row) => row.subject !== null || row.body !== null;
const effSubject = (row) => merge(row.subject !== null ? row.subject : state.template.subject, row);
const effBody = (row) => merge(row.body !== null ? row.body : state.template.body, row);
const effPath = (row) => (row.filepath !== null && row.filepath !== "") ? row.filepath : state.filepath;
const selRow = () => state.rows.find(r => r.id === state.sel) || null;
const rowLabel = (r) => r.company || r.name || splitAddrs(r.to)[0] || "（未入力）";

/* ---------- 描画 ---------- */
function renderCounts() {
  const sendable = state.rows.filter(r => splitAddrs(r.to).length && !badAddrs(r).length).length;
  const bad = state.rows.length - sendable;
  const own = state.rows.filter(isOwn).length;
  $("#counts").innerHTML =
    `<span class="pill ok">配信 ${sendable} 件</span>` +
    (own ? `<span class="pill own">個別 ${own}</span>` : "") +
    (bad ? `<span class="pill bad">要確認 ${bad}</span>` : "");
  $("#listSub").textContent = `${state.rows.length} 件`;
  $("#tmplItem").setAttribute("aria-selected", state.sel === "template");
  const shared = state.rows.length - own;
  $("#tmplTag").textContent = `${shared} 件に適用`;
}

function renderList() {
  const ul = $("#list");
  ul.textContent = "";
  state.rows.forEach(r => {
    const li = document.createElement("li");
    li.role = "option";
    li.tabIndex = 0;
    li.dataset.id = r.id;
    li.setAttribute("aria-selected", state.sel === r.id);
    const bad = badAddrs(r).length || !splitAddrs(r.to).length;
    li.innerHTML =
      `<span class="t"></span>` +
      `<span class="tag ${isOwn(r) ? "own" : ""} ${bad ? "bad" : ""}">${bad ? "要確認" : isOwn(r) ? "個別" : "共通"}</span>` +
      `<span class="s mono"></span>`;
    li.querySelector(".t").textContent = rowLabel(r);
    li.querySelector(".s").textContent = splitAddrs(r.to).join(", ") || "Toアドレス未入力";
    ul.appendChild(li);
  });
  if (!state.rows.length) ul.innerHTML = `<li class="empty" style="cursor:default">宛先がありません</li>`;
  $("#dupBtn").disabled = $("#delBtn").disabled = !selRow();
}

function renderPreview() {
  const el = $("#preview");
  if (!el) return;
  const r = selRow() || state.rows[0] || { name:"", to:"", cc:"", company:"" };
  const sub = state.sel === "template" ? merge(state.template.subject, r) : effSubject(r);
  const body = state.sel === "template" ? merge(state.template.body, r) : effBody(r);
  const path = state.sel === "template" ? state.filepath : effPath(r);
  el.innerHTML =
    `<div class="subj">${esc(sub) || "（件名未入力）"}</div>` +
    `<div class="to mono">To: ${esc(splitAddrs(r.to).join(", ")) || "—"}<br>` +
    `Cc: ${esc(rowCc().join(", ")) || "—"}<br>` +
    `Bcc: ${esc(splitAddrs(state.bcc).join(", ")) || "—"}` +
    (path ? `<br>添付: ${esc(path)}` : "") + `</div>` +
    (esc(body).replace(/\n/g, "<br>") || "<span style='color:var(--muted)'>（本文未入力）</span>");
}

function renderEditor() {
  const ed = $("#editor");
  const row = selRow();
  ed.textContent = "";

  if (state.sel === "template" || !row) {
    if (state.sel !== "template") state.sel = "template";
    const shared = state.rows.length - state.rows.filter(isOwn).length;
    $("#edTitle").textContent = "共通ひな形";
    $("#edSub").textContent = `個別に書いていない ${shared} 件に使われます`;
    ed.innerHTML = `
      <label class="field"><span class="lab">件名（E列）</span>
        <input type="text" id="edSubject"></label>
      <label class="field"><span class="lab">本文（F列 → G列に &lt;br&gt; 付きで自動変換）</span>
        <textarea id="edBody"></textarea></label>
      <p class="hint">改行はそのまま入力してください。差し込みタグ <code>{{会社名}}</code> <code>{{名前}}</code> は宛先ごとに置き換わります。</p>
      <div class="modebar">
        <span class="txt">個別に書き換えた宛先には、このひな形は反映されません。</span>
        <button class="btn tiny" id="resetAll">すべて共通ひな形にそろえる</button>
      </div>
      <div><div class="lab" style="font-size:11px;letter-spacing:.09em;color:var(--muted);margin-bottom:5px">プレビュー（1件目の宛先で差し込み）</div>
        <div class="preview" id="preview"></div></div>`;
    $("#edSubject").value = state.template.subject;
    $("#edBody").value = state.template.body;
    $("#edSubject").addEventListener("input", e => { state.template.subject = e.target.value; touch(); });
    $("#edBody").addEventListener("input", e => { state.template.body = e.target.value; touch(); });
    $("#resetAll").addEventListener("click", () => {
      const own = state.rows.filter(isOwn).length;
      if (!own) { toast("個別に書かれた宛先はありません"); return; }
      if (!confirm(`個別に書いた ${own} 件の文面を破棄して、すべて共通ひな形にそろえます。よろしいですか？`)) return;
      state.rows.forEach(r => { r.subject = null; r.body = null; });
      render();
      toast(`${own} 件を共通ひな形にそろえました`);
    });
    renderPreview();
    return;
  }

  const own = isOwn(row);
  $("#edTitle").textContent = rowLabel(row);
  $("#edSub").textContent = own ? "この宛先だけの文面" : "共通ひな形を使用中";
  ed.innerHTML = `
    <div class="grid2">
      <label class="field"><span class="lab">名前（A列）</span><input type="text" id="fName"></label>
      <label class="field"><span class="lab">会社名（I列）</span><input type="text" id="fCompany"></label>
      <label class="field"><span class="lab">To（B列 / , 区切りで複数可）</span><input type="text" id="fTo" class="mono"></label>
    </div>
    <div class="modebar">
      <span class="txt">${own ? "この宛先は個別の文面です。ひな形を編集しても影響を受けません。" : "共通ひな形の文面をそのまま送ります。"}</span>
      ${own
        ? `<button class="btn tiny" id="toTmpl">ひな形に反映</button><button class="btn tiny" id="unown">共通ひな形に戻す</button>`
        : `<button class="btn tiny" id="own">この宛先だけ書き換える</button>`}
    </div>
    <label class="field"><span class="lab">件名（E列）</span>
      <input type="text" id="edSubject" ${own ? "" : "disabled"}></label>
    <label class="field"><span class="lab">本文（F列 → G列に &lt;br&gt; 付きで自動変換）</span>
      <textarea id="edBody" ${own ? "" : "disabled"}></textarea></label>
    <label class="field"><span class="lab">添付ファイルパス（H列 / 空欄なら共通設定の値）</span>
      <input type="text" id="fPath" class="mono" placeholder="${esc(state.filepath || "（未設定）")}"></label>
    <div><div class="lab" style="font-size:11px;letter-spacing:.09em;color:var(--muted);margin-bottom:5px">送信プレビュー（差し込み後）</div>
      <div class="preview" id="preview"></div></div>`;

  $("#fName").value = row.name; $("#fCompany").value = row.company;
  $("#fTo").value = row.to;
  $("#fPath").value = row.filepath || "";
  $("#edSubject").value = own ? row.subject : state.template.subject;
  $("#edBody").value = own ? row.body : state.template.body;

  const bind = (id, key, relist) => $(id).addEventListener("input", e => {
    row[key] = e.target.value;
    if (relist) { renderList(); renderCounts(); $("#edTitle").textContent = rowLabel(row); }
    touch();
  });
  bind("#fName", "name", true); bind("#fCompany", "company", true);
  bind("#fTo", "to", true);
  $("#fPath").addEventListener("input", e => { row.filepath = e.target.value || null; touch(); });

  if (own) {
    $("#edSubject").addEventListener("input", e => { row.subject = e.target.value; touch(); });
    $("#edBody").addEventListener("input", e => { row.body = e.target.value; touch(); });
    $("#unown").addEventListener("click", () => {
      if (!confirm("この宛先の文面を破棄して、共通ひな形に戻します。よろしいですか？")) return;
      row.subject = null; row.body = null; render();
    });
    $("#toTmpl").addEventListener("click", () => {
      if (!confirm("この文面を共通ひな形に上書きします。よろしいですか？")) return;
      state.template = { subject: row.subject, body: row.body };
      row.subject = null; row.body = null; render();
      toast("共通ひな形を更新しました");
    });
  } else {
    $("#own").addEventListener("click", () => {
      row.subject = state.template.subject; row.body = state.template.body;
      render();
      $("#edBody").focus();
    });
  }
  renderPreview();
}

const touch = () => { renderCounts(); renderPreview(); save(); };
const render = () => { renderCounts(); renderList(); renderEditor(); save(); };

/* ---------- 操作 ---------- */
const select = (id) => { state.sel = id; render(); };
$("#tmplItem").addEventListener("click", () => select("template"));
$("#tmplItem").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select("template"); } });
$("#list").addEventListener("click", e => { const li = e.target.closest("li[data-id]"); if (li) select(li.dataset.id); });
$("#list").addEventListener("keydown", e => {
  const li = e.target.closest("li[data-id]");
  if (li && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(li.dataset.id); }
});

$("#addBtn").addEventListener("click", () => {
  const r = { id: uid(), name:"", to:"", company:"", subject:null, body:null, filepath:null };
  state.rows.push(r); select(r.id); $("#fName").focus();
});
$("#dupBtn").addEventListener("click", () => {
  const r = selRow(); if (!r) return;
  const c = { ...r, id: uid() };
  state.rows.splice(state.rows.indexOf(r) + 1, 0, c);
  select(c.id); toast("宛先を複製しました");
});
$("#delBtn").addEventListener("click", () => {
  const r = selRow(); if (!r) return;
  if (!confirm(`「${rowLabel(r)}」を削除します。よろしいですか？`)) return;
  state.rows.splice(state.rows.indexOf(r), 1);
  select("template");
});

const dlg = $("#pasteDlg");
$("#pasteBtn").addEventListener("click", () => { $("#pasteArea").value = ""; dlg.showModal(); });
$("#pasteCancel").addEventListener("click", () => dlg.close());
$("#pasteOk").addEventListener("click", () => {
  const lines = $("#pasteArea").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line => {
    const cols = (line.includes("\t") ? line.split("\t") : line.split(",")).map(x => x.trim());
    let [name, to, company] = [cols[0] || "", cols[1] || "", cols[2] || ""];
    if (/^名前$/.test(name) && /メール|To/i.test(to)) return;          // 見出し行
    if (!to && isMail(name)) { to = name; name = ""; }                  // アドレスだけの行
    if (!to) return;
    state.rows.push({ id: uid(), name, to, company, subject:null, body:null, filepath:null });
    added++;
  });
  dlg.close(); render();
  toast(added ? `${added} 件を追加しました` : "追加できる行がありませんでした");
});

[["commonCc","commonCc"],["bcc","bcc"],["filepath","filepath"],["sep","sep"]].forEach(([id, key]) => {
  const el = $("#" + id);
  el.value = state[key];
  el.addEventListener("input", () => { state[key] = el.value; renderList(); touch(); });
});

$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
});

let toastT;
function toast(msg) {
  clearTimeout(toastT);
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(() => el.remove(), 2600);
}

/* ---------- Excel 取り込み ---------- */
const impDlg = $("#importDlg");
let imp = null;   // { sheets:{name:aoa}, aoa, headRow }

const colName = (i, label) => XLSX.utils.encode_col(i) + "列" + (label ? "：" + label : "");
const cellText = (v) => v == null ? "" : String(v).trim();
const brToNl = (s) => s.replace(/<br\s*\/?>/gi, "\n").replace(/&nbsp;/gi, " ");

$("#importBtn").addEventListener("click", () => {
  if (typeof XLSX === "undefined") { toast("Excel読込ライブラリを読み込めませんでした。オンラインで開き直してください"); return; }
  imp = null;
  $("#impStep1").hidden = false; $("#impStep2").hidden = true;
  $("#impOk").hidden = true; $("#impBack").hidden = true;
  $("#impFile").value = "";
  impDlg.showModal();
});
$("#impCancel").addEventListener("click", () => impDlg.close());
$("#impBack").addEventListener("click", () => {
  $("#impStep1").hidden = false; $("#impStep2").hidden = true;
  $("#impOk").hidden = true; $("#impBack").hidden = true;
});

const drop = $("#drop");
drop.addEventListener("click", () => $("#impFile").click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) readWorkbook(f);
});
$("#impFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) readWorkbook(f); });

function readWorkbook(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let wb;
    try { wb = XLSX.read(new Uint8Array(fr.result), { type:"array" }); }
    catch (err) { toast("このファイルは読み込めませんでした"); return; }
    const sheets = {};
    wb.SheetNames.forEach(n => {
      sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, blankrows:false, defval:"" });
    });
    imp = { file: file.name, sheets, sheet: wb.SheetNames[0], headRow: 0 };
    $("#mSheet").innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join("");
    $("#impStep1").hidden = true; $("#impStep2").hidden = false;
    $("#impOk").hidden = false; $("#impBack").hidden = false;
    buildMapping(true);
  };
  fr.readAsArrayBuffer(file);
}

$("#mSheet").addEventListener("change", e => { imp.sheet = e.target.value; imp.headRow = 0; buildMapping(true); });
$("#mHead").addEventListener("change", e => { imp.headRow = Number(e.target.value); buildMapping(false); });

function buildMapping(guessHead) {
  const aoa = imp.sheets[imp.sheet] || [];
  if (guessHead) {
    imp.headRow = Math.max(0, aoa.findIndex(r => r.some(c => cellText(c))));
    $("#mHead").innerHTML = aoa.slice(0, Math.min(aoa.length, 15))
      .map((r, i) => `<option value="${i}">${i + 1} 行目：${esc(r.map(cellText).filter(Boolean).slice(0, 4).join(" / ")).slice(0, 40)}</option>`).join("");
  }
  $("#mHead").value = String(imp.headRow);

  const head = (aoa[imp.headRow] || []).map(cellText);
  const width = Math.max(head.length, ...aoa.slice(imp.headRow + 1).map(r => r.length), 1);
  const labels = Array.from({ length: width }, (_, i) => colName(i, head[i] || ""));
  imp.width = width;

  const find = (re) => head.findIndex(h => h && re.test(h));
  const guess = {
    name: find(/名前|氏名|担当|宛名/),
    company: find(/会社|学校|大学|法人|団体|生協/),
    to: find(/^to|メールアドレス|アドレス|mail/i),
    subject: find(/件名|題名|subject/i),
    body: find(/本文|body|文面/i),
    filepath: find(/ファイル|添付|path/i)
  };

  document.querySelectorAll("[data-map]").forEach(sel => {
    const role = sel.dataset.map;
    sel.innerHTML = `<option value="-1">（使わない）</option>` +
      labels.map((l, i) => `<option value="${i}">${esc(l)}</option>`).join("");
    sel.value = String(guess[role] >= 0 ? guess[role] : -1);
    sel.onchange = updatePreview;
  });

  updatePreview();
}

function readImportRows() {
  const aoa = imp.sheets[imp.sheet] || [];
  const map = {};
  document.querySelectorAll("[data-map]").forEach(sel => { map[sel.dataset.map] = Number(sel.value); });
  const get = (r, i) => i >= 0 ? cellText(r[i]) : "";

  const out = [];
  aoa.slice(imp.headRow + 1).forEach(r => {
    const to = get(r, map.to);
    if (!to) return;
    const subject = get(r, map.subject);
    const body = brToNl(get(r, map.body));
    out.push({
      id: uid(), name: get(r, map.name), to, company: get(r, map.company),
      subject: subject || null, body: body || null,
      filepath: get(r, map.filepath) || null
    });
  });
  return out;
}

function updatePreview() {
  const rows = readImportRows();
  const bad = rows.filter(r => badAddrs(r).length).length;
  $("#impInfo").textContent = `${imp.file} / シート「${imp.sheet}」・${imp.width} 列`;
  $("#impPreview").innerHTML = rows.length
    ? `取り込める宛先：<strong>${rows.length} 件</strong>` + (bad ? ` （アドレス形式の要確認 ${bad} 件）` : "") +
      `<br>先頭： ${esc(rows[0].company || rows[0].name || "—")} / ${esc(rows[0].to)}`
    : `Toアドレスの列を指定してください（この設定では取り込める行がありません）。`;
  $("#impOk").disabled = !rows.length;
}

$("#impOk").addEventListener("click", () => {
  const rows = readImportRows();
  if (!rows.length) return;

  // 全行で同じ件名・本文なら、個別ではなく共通ひな形として取り込む
  const allSame = (k) => rows[0][k] && rows.every(r => r[k] === rows[0][k]);
  if (allSame("subject")) { state.template.subject = rows[0].subject; rows.forEach(r => r.subject = null); }
  if (allSame("body")) { state.template.body = rows[0].body; rows.forEach(r => r.body = null); }

  if ($("#mMode").value === "replace") state.rows = rows;
  else state.rows = state.rows.concat(rows);

  impDlg.close();
  state.sel = "template";
  render();
  toast(`${rows.length} 件を取り込みました`);
});

/* ---------- Excel 生成 ---------- */
function buildSheet() {
  const sep = state.sep;
  const bcc = splitAddrs(state.bcc).join(sep);
  const rows = state.rows.filter(r => splitAddrs(r.to).length);
  const cc = rowCc();
  const maxCc = cc.length;

  const head = HEADERS.slice();
  for (let i = 1; i < maxCc; i++) head.push("");
  const aoa = [head];

  rows.forEach(row => {
    const body = effBody(row);
    aoa.push([
      row.name || "",
      splitAddrs(row.to).join(sep),
      cc.join(sep),
      bcc,
      effSubject(row),
      body,
      body.replace(/\r?\n/g, "<br>"),
      effPath(row) || "",
      row.company || "",
      "",
      ...cc
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{ wch:10 },{ wch:29 },{ wch:30 },{ wch:27 },{ wch:37 },{ wch:53 },{ wch:53 },{ wch:56 },{ wch:22 },{ wch:3 }]
    .concat(Array.from({ length: Math.max(maxCc, 1) }, () => ({ wch:28 })));
  ws["!freeze"] = { xSplit: 0, ySplit: 1 };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  return { wb, count: rows.length };
}

$("#dlBtn").addEventListener("click", async () => {
  if (typeof XLSX === "undefined") { toast("Excel生成ライブラリを読み込めませんでした。オンラインで開き直してください"); return; }
  const flagged = state.rows.filter(r => badAddrs(r).length).length;
  if (flagged && !confirm(`アドレス形式が怪しい宛先が ${flagged} 件あります。このまま出力しますか？`)) return;

  const { wb, count } = buildSheet();
  if (!count) { toast("Toアドレスの入った宛先がありません"); return; }

  const buf = XLSX.write(wb, { bookType:"xlsx", type:"array" });
  const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const filename = `一斉配信_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.xlsx`;

  const downloads = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast(`${count} 件を書き出しました`); }
    catch (err) { toast(err && err.code === "declined" ? "保存をキャンセルしました" : "保存できませんでした"); }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${count} 件を書き出しました`);
});

render();
</script>
