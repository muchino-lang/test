<title>営業資料ファインダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F2F3F1;
    --surface:#FFFFFF;
    --surface-2:#E9EBE8;
    --line:#D7DBD6;
    --line-strong:#BCC3BD;
    --ink:#1A1E1C;
    --muted:#5F6862;
    --accent:#10635A;
    --accent-ink:#0B4A43;
    --accent-soft:#DCEBE7;
    --on-accent:#FFFFFF;
    --ok:#2C6E49;
    --warn:#8F5310;
    --danger:#9B2C2C;
    --shadow:0 1px 2px rgba(20,32,28,.06), 0 8px 24px rgba(20,32,28,.07);
    --radius:10px;
    --font-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121614;
      --surface:#1A201D;
      --surface-2:#232A27;
      --line:#333C38;
      --line-strong:#48534D;
      --ink:#E6EBE7;
      --muted:#9AA6A0;
      --accent:#58C7B2;
      --accent-ink:#A7E3D6;
      --accent-soft:#1E3A35;
      --on-accent:#0C1512;
      --ok:#6FCF97;
      --warn:#E0A458;
      --danger:#E98B8B;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121614;
    --surface:#1A201D;
    --surface-2:#232A27;
    --line:#333C38;
    --line-strong:#48534D;
    --ink:#E6EBE7;
    --muted:#9AA6A0;
    --accent:#58C7B2;
    --accent-ink:#A7E3D6;
    --accent-soft:#1E3A35;
    --on-accent:#0C1512;
    --ok:#6FCF97;
    --warn:#E0A458;
    --danger:#E98B8B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .wrap{max-width:1060px;margin:0 auto;padding-inline:18px}

  /* ---------- header ---------- */
  header.bar{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:40;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{display:flex;flex-direction:column;gap:12px;padding-block:14px 12px}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:19px;
    letter-spacing:.02em;
    margin:0;
    white-space:nowrap;
  }
  .brand .tag{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-family:var(--font-mono);font-weight:500;
  }
  .counts{font-size:12.5px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  .counts b{color:var(--ink);font-weight:500}

  .searchrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
  .field{
    position:relative;flex:1 1 320px;min-width:0;
    display:flex;align-items:center;
    background:var(--surface);
    border:1.5px solid var(--line-strong);
    border-radius:var(--radius);
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field svg{flex:none;margin-left:12px;color:var(--muted)}
  #q{
    flex:1;min-width:0;border:0;background:transparent;outline:none;
    padding:11px 10px;font-size:16px;font-weight:500;
  }
  #q::placeholder{color:var(--muted);font-weight:400}
  .slash{
    flex:none;margin-right:8px;padding:2px 7px;border-radius:5px;
    background:var(--surface-2);color:var(--muted);
    font-family:var(--font-mono);font-size:11px;line-height:1.6;
  }
  .clear-btn{
    flex:none;border:0;background:transparent;color:var(--muted);
    cursor:pointer;padding:6px 10px;font-size:13px;
  }
  .clear-btn:hover{color:var(--ink)}

  .btn{
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
    border:1.5px solid var(--line-strong);background:var(--surface);
    border-radius:var(--radius);padding:9px 14px;
    font-size:13.5px;font-weight:500;cursor:pointer;
    white-space:nowrap;transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{opacity:.88;color:var(--on-accent);border-color:var(--accent)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .chip{
    border:1px solid var(--line-strong);background:transparent;color:var(--muted);
    border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
    transition:all .12s ease;
  }
  .chip:hover{color:var(--ink);border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip .n{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-left:4px}


  /* ---------- 共有ルール ---------- */
  .rule{
    display:flex;gap:12px;align-items:flex-start;
    margin-top:16px;padding:11px 14px;
    background:var(--accent-soft);
    border:1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius:var(--radius);
  }
  .rule .lbl{
    flex:none;margin-top:2px;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;
    color:var(--on-accent);background:var(--accent);
    padding:2px 7px;border-radius:4px;white-space:nowrap;
  }
  .rule p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
  .rule b{font-weight:700}
  .rule .sub{color:var(--muted);font-size:12.5px}

  .chip.toggle{margin-left:auto;border-style:dashed}
  .chip.toggle[aria-pressed="true"]{border-style:solid}
  .ppt-hint{
    margin:-6px 0 18px;font-size:12.5px;color:var(--muted);
  }
  .ppt-hint button{
    border:0;background:transparent;padding:0;cursor:pointer;
    color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:2px;
  }
  .badge.fmt-ppt::after{content:" 社内編集用";letter-spacing:0}

  /* ---------- notice ---------- */
  .notice{
    margin-top:16px;padding:12px 14px;border-radius:var(--radius);
    background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--warn);
    font-size:13.5px;color:var(--muted);
  }
  .notice b{color:var(--ink);font-weight:700}

  /* ---------- list ---------- */
  main{padding-top:18px}
  .group{margin-bottom:26px}
  .group-head{
    display:flex;align-items:center;gap:10px;
    padding:0 2px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  .group-head h2{
    font-family:var(--font-display);font-weight:700;font-size:14px;
    letter-spacing:.06em;margin:0;
  }
  .group-head .n{
    font-family:var(--font-mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .row{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:12px;
    padding:11px 12px 11px 6px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .row:first-of-type{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
  .row:last-of-type{border-bottom:0;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
  .group .rows{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px;box-shadow:var(--shadow)}
  .row:hover{background:var(--surface-2)}
  .row.is-selected{background:var(--accent-soft)}

  .pick{display:flex;align-items:center;justify-content:center;width:34px;flex:none}
  .pick input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  .info{min-width:0}
  .title{
    font-weight:500;font-size:15px;line-height:1.5;
    overflow-wrap:anywhere;
  }
  .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
  .badge{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;
    padding:1px 6px;border-radius:4px;
    background:var(--surface-2);color:var(--muted);
    border:1px solid var(--line);
  }
  .badge.fmt-pdf{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%, var(--line))}
  .badge.fmt-ppt{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%, var(--line))}
  .badge.price{
    color:var(--accent-ink);background:var(--accent-soft);
    border-color:color-mix(in srgb,var(--accent) 30%, var(--line));
    font-variant-numeric:tabular-nums;font-weight:500;
  }
  :root[data-theme="dark"] .badge.price{color:var(--accent-ink)}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5}

  .acts{display:flex;gap:6px;align-items:center;flex:none}
  .iconbtn{
    border:1px solid var(--line-strong);background:var(--surface);
    border-radius:7px;padding:5px 9px;font-size:12.5px;cursor:pointer;
    color:var(--muted);white-space:nowrap;
    transition:all .12s ease;
  }
  .iconbtn:hover{color:var(--accent);border-color:var(--accent)}
  .iconbtn.copied{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .iconbtn.mini{padding:5px 7px}

  .empty{
    text-align:center;padding:52px 20px;color:var(--muted);
    border:1px dashed var(--line-strong);border-radius:var(--radius);
  }
  .empty strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);margin-bottom:6px}

  .skeleton{height:56px;border-bottom:1px solid var(--line);background:
    linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);
    background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @media (prefers-reduced-motion: reduce){.skeleton{animation:none}}

  /* ---------- selection bar ---------- */
  .selbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--surface);
    border-top:1px solid var(--line-strong);
    box-shadow:0 -6px 24px rgba(20,32,28,.10);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .selbar-inner{
    max-width:1060px;margin:0 auto;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .selbar .count{
    font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums;
    color:var(--ink);margin-right:auto;
  }
  .selbar .count b{color:var(--accent);font-size:16px}

  /* ---------- dialog ---------- */
  dialog{
    border:1px solid var(--line-strong);border-radius:14px;
    background:var(--surface);color:var(--ink);
    padding:0;width:min(560px, calc(100vw - 32px));
    box-shadow:0 24px 60px rgba(10,20,16,.28);
  }
  dialog::backdrop{background:rgba(12,20,17,.5)}
  .dlg-head{
    padding:18px 20px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .dlg-head h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700}
  .dlg-body{padding:16px 20px;display:flex;flex-direction:column;gap:13px;max-height:66vh;overflow-y:auto}
  .dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
  .f{display:flex;flex-direction:column;gap:5px}
  .f label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
  .f input,.f select,.f textarea{
    border:1.5px solid var(--line-strong);border-radius:8px;
    background:var(--bg);padding:9px 11px;font-size:14px;width:100%;
  }
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .f .hint{font-size:11.5px;color:var(--muted)}
  .f-row{display:flex;gap:11px;flex-wrap:wrap}
  .f-row .f{flex:1 1 150px}
  #f-url{font-family:var(--font-mono);font-size:13px}
  .del-btn{margin-right:auto;border-color:transparent;background:transparent;color:var(--danger)}
  .del-btn:hover{border-color:var(--danger);color:var(--danger)}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    z-index:80;
    background:var(--ink);color:var(--bg);
    padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:500;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  @media (prefers-reduced-motion: reduce){#toast{transition:none}}

  @media (max-width:620px){
    .row{grid-template-columns:auto 1fr;row-gap:9px}
    .acts{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
    .counts{width:100%}
  }
</style>

<header class="bar">
  <div class="wrap bar-inner">
    <div class="brandrow">
      <div class="brand">
        <h1>営業資料ファインダー</h1>
        <span class="tag">Sales Assets</span>
      </div>
      <div class="counts" id="counts">読み込み中…</div>
    </div>

    <div class="searchrow">
      <div class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="資料名・機種・価格で検索（例：84000／卸／実施要項／BYOD）">
        <span class="slash" aria-hidden="true">/</span>
        <button class="clear-btn" id="clear" type="button" hidden>クリア</button>
      </div>
      <button class="btn" id="add" type="button">＋ 資料を追加</button>
    </div>

    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="wrap">
  <div class="rule">
    <span class="lbl">共有ルール</span>
    <p><b>お客様への共有は原則PDFです。</b>PPTは社内で数字や文言を差し替えるための編集用なので、そのままお客様に送らないでください。<br>
    <span class="sub">PPT版は既定で非表示にしています。編集したいときだけ右の「PPT版も表示」を押してください。</span></p>
  </div>
</div>

<div class="wrap">
  <div class="notice" id="notice" hidden></div>
</div>

<div class="wrap"><div class="ppt-hint" id="ppt-hint" hidden></div></div>

<main class="wrap" id="list">
  <div class="group">
    <div class="group-head"><h2>読み込み中</h2></div>
    <div class="rows"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</main>

<div class="selbar" id="selbar" hidden>
  <div class="selbar-inner">
    <div class="count"><b id="sel-n">0</b> 件を選択中</div>
    <button class="btn" id="sel-copy-url" type="button">URLだけコピー</button>
    <button class="btn primary" id="sel-copy-both" type="button">資料名＋URLをコピー</button>
    <button class="btn ghost" id="sel-clear" type="button">選択を解除</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <div class="dlg-head">
      <h3 id="dlg-title">資料を追加</h3>
      <button class="btn ghost" type="button" id="dlg-x" aria-label="閉じる">✕</button>
    </div>
    <div class="dlg-body">
      <div class="f">
        <label for="f-title">資料名</label>
        <input id="f-title" required placeholder="例：U9311 エンド84000 仕様書">
        <span class="hint">お客様に見せる正式ファイル名ではなく、自分が探しやすい呼び方でOKです。</span>
      </div>
      <div class="f">
        <label for="f-url">URL</label>
        <input id="f-url" required type="url" placeholder="https://app.box.com/s/...">
      </div>
      <div class="f-row">
        <div class="f">
          <label for="f-cat">カテゴリ</label>
          <input id="f-cat" list="cats" placeholder="例：機種仕様（27年度）">
          <datalist id="cats"></datalist>
        </div>
        <div class="f">
          <label for="f-fmt">形式</label>
          <select id="f-fmt">
            <option value="PDF">PDF</option>
            <option value="PPT">PPT</option>
            <option value="XLS">XLS</option>
            <option value="">その他</option>
          </select>
        </div>
      </div>
      <div class="f">
        <label for="f-note">補足メモ</label>
        <input id="f-note" placeholder="例：周辺機器手数料なし／固定コミッション">
      </div>
      <div class="f">
        <label for="f-tags">検索キーワード</label>
        <input id="f-tags" placeholder="スペース区切り：U9311 エンド 84000 税別">
        <span class="hint">資料名に入っていない言葉でも、ここに入れておけば検索で引っかかります。</span>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn del-btn" type="button" id="dlg-del" hidden>削除</button>
      <button class="btn" type="button" id="dlg-cancel">キャンセル</button>
      <button class="btn primary" type="submit" id="dlg-save">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  var CAT_ORDER = [
    "チラシ・パンフレット",
    "機種仕様（27年度）",
    "実施要項（27年度）",
    "手数料設定",
    "事例資料",
    "BYOD提案資料",
    "新入生チラシ"
  ];

  var db = null;
  var items = [];
  var loaded = false;
  var selected = new Set();
  var activeCat = null;
  var editingId = null;
  var showPpt = false;
  try { showPpt = window.localStorage.getItem("shiryo-finder:showPpt") === "1"; } catch (e) { showPpt = false; }

  var $ = function(id){ return document.getElementById(id); };
  var qEl = $("q"), listEl = $("list"), chipsEl = $("chips"), countsEl = $("counts");
  var selbar = $("selbar"), toastEl = $("toast"), dlg = $("dlg"), noticeEl = $("notice");

  /* ---------- text normalisation (kana / width tolerant) ---------- */
  function norm(s){
    if (s == null) return "";
    return String(s)
      .replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); })
      .replace(/[　\s,、，]/g, "")
      .toLowerCase();
  }
  function haystack(it){
    return norm([it.title, it.category, it.note, it.tags, it.format, it.url].join(" "));
  }

  /* ---------- clipboard ---------- */
  function copyText(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text){
    return new Promise(function(resolve, reject){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("copy failed"));
    });
  }
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }
  function doCopy(text, msg, btn){
    copyText(text).then(function(){
      toast(msg);
      if (btn) {
        var prev = btn.textContent;
        btn.textContent = "コピー済";
        btn.classList.add("copied");
        setTimeout(function(){ btn.textContent = prev; btn.classList.remove("copied"); }, 1300);
      }
    }).catch(function(){
      toast("コピーできませんでした。URLを長押し／右クリックでコピーしてください。");
    });
  }

  /* ---------- sorting / filtering ---------- */
  function catRank(c){
    var i = CAT_ORDER.indexOf(c);
    return i === -1 ? CAT_ORDER.length : i;
  }
  function sorted(){
    return items.slice().sort(function(a, b){
      var d = catRank(a.category) - catRank(b.category);
      if (d) return d;
      if (a.category !== b.category) return a.category < b.category ? -1 : 1;
      var ao = typeof a.order === "number" ? a.order : 9e9;
      var bo = typeof b.order === "number" ? b.order : 9e9;
      if (ao !== bo) return ao - bo;
      return a.id < b.id ? -1 : 1;
    });
  }
  function visibleFormat(it){
    return showPpt || it.format !== "PPT";
  }
  function baseItems(){
    return items.filter(visibleFormat);
  }
  function setShowPpt(on){
    showPpt = !!on;
    try { window.localStorage.setItem("shiryo-finder:showPpt", showPpt ? "1" : "0"); } catch (e) { /* ignore */ }
    if (!showPpt) {
      items.forEach(function(it){ if (it.format === "PPT") selected.delete(it.id); });
      renderSelbar();
    }
    renderChips();
    render();
  }

  function matches(it, terms){
    if (activeCat && it.category !== activeCat) return false;
    if (!terms.length) return true;
    var h = it._hay;
    for (var i = 0; i < terms.length; i++) { if (h.indexOf(terms[i]) === -1) return false; }
    return true;
  }
  function terms(){
    var raw = norm(qEl.value);
    if (!raw) return [];
    // split on original spaces, then normalise each piece
    return qEl.value.trim().split(/[\s　]+/).map(norm).filter(Boolean);
  }

  /* ---------- rendering ---------- */
  function badge(text, cls){
    var s = document.createElement("span");
    s.className = "badge" + (cls ? " " + cls : "");
    s.textContent = text;
    return s;
  }

  function rowEl(it){
    var row = document.createElement("div");
    row.className = "row" + (selected.has(it.id) ? " is-selected" : "");
    row.dataset.id = it.id;

    var pick = document.createElement("div");
    pick.className = "pick";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = selected.has(it.id);
    cb.id = "pick-" + it.id;
    cb.setAttribute("aria-label", it.title + " を選択");
    cb.addEventListener("change", function(){
      if (cb.checked) selected.add(it.id); else selected.delete(it.id);
      row.classList.toggle("is-selected", cb.checked);
      renderSelbar();
    });
    pick.appendChild(cb);

    var info = document.createElement("div");
    info.className = "info";
    var t = document.createElement("div");
    t.className = "title";
    t.textContent = it.title;
    info.appendChild(t);

    var meta = document.createElement("div");
    meta.className = "meta";
    if (it.format) meta.appendChild(badge(it.format, it.format === "PDF" ? "fmt-pdf" : (it.format === "PPT" ? "fmt-ppt" : "")));
    if (it.model) meta.appendChild(badge(it.model));
    if (it.priceLabel) meta.appendChild(badge(it.priceLabel, "price"));
    if (it.note) {
      var n = document.createElement("span");
      n.className = "note";
      n.textContent = it.note;
      meta.appendChild(n);
    }
    if (meta.childNodes.length) info.appendChild(meta);

    var acts = document.createElement("div");
    acts.className = "acts";

    var bUrl = document.createElement("button");
    bUrl.type = "button";
    bUrl.className = "iconbtn";
    bUrl.textContent = "URLコピー";
    bUrl.addEventListener("click", function(){ doCopy(it.url, "URLをコピーしました", bUrl); });

    var bBoth = document.createElement("button");
    bBoth.type = "button";
    bBoth.className = "iconbtn";
    bBoth.textContent = "名前＋URL";
    bBoth.addEventListener("click", function(){ doCopy(line(it), "資料名とURLをコピーしました", bBoth); });

    var bOpen = document.createElement("a");
    bOpen.className = "iconbtn";
    bOpen.href = it.url;
    bOpen.target = "_blank";
    bOpen.rel = "noopener noreferrer";
    bOpen.textContent = "開く";

    var bEdit = document.createElement("button");
    bEdit.type = "button";
    bEdit.className = "iconbtn mini";
    bEdit.title = "編集";
    bEdit.setAttribute("aria-label", it.title + " を編集");
    bEdit.textContent = "✎";
    bEdit.addEventListener("click", function(){ openDialog(it); });

    acts.appendChild(bUrl);
    acts.appendChild(bBoth);
    acts.appendChild(bOpen);
    acts.appendChild(bEdit);

    row.appendChild(pick);
    row.appendChild(info);
    row.appendChild(acts);
    return row;
  }

  function line(it){
    return it.title + "\n" + it.url;
  }

  function render(){
    var ts = terms();
    var hits = sorted().filter(function(it){ return matches(it, ts); });
    var shown = hits.filter(visibleFormat);
    renderPptHint(hits.length - shown.length);

    listEl.textContent = "";

    if (!loaded) {
      countsEl.textContent = "読み込み中…";
      return;
    }

    countsEl.innerHTML = "";
    countsEl.appendChild(document.createTextNode("表示 "));
    var b1 = document.createElement("b"); b1.textContent = String(shown.length); countsEl.appendChild(b1);
    countsEl.appendChild(document.createTextNode(" / 全 " + baseItems().length + " 件"));

    if (!items.length) {
      var e0 = document.createElement("div");
      e0.className = "empty";
      e0.innerHTML = "<strong>まだ資料が登録されていません</strong>右上の「＋ 資料を追加」から登録してください。";
      listEl.appendChild(e0);
      return;
    }

    if (!shown.length) {
      var e = document.createElement("div");
      e.className = "empty";
      var st = document.createElement("strong");
      st.textContent = "「" + qEl.value.trim() + "」に一致する資料はありません";
      e.appendChild(st);
      e.appendChild(document.createTextNode("機種名（U9311）、価格（84000）、卸／エンド、カテゴリ名などでもう一度お試しください。"));
      listEl.appendChild(e);
      return;
    }

    var curCat = null, groupRows = null;
    shown.forEach(function(it){
      if (it.category !== curCat) {
        curCat = it.category;
        var g = document.createElement("section");
        g.className = "group";
        var gh = document.createElement("div");
        gh.className = "group-head";
        var h2 = document.createElement("h2");
        h2.textContent = curCat || "未分類";
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = shown.filter(function(x){ return x.category === curCat; }).length + " 件";
        gh.appendChild(h2); gh.appendChild(n);
        groupRows = document.createElement("div");
        groupRows.className = "rows";
        g.appendChild(gh); g.appendChild(groupRows);
        listEl.appendChild(g);
      }
      groupRows.appendChild(rowEl(it));
    });
  }

  function renderPptHint(n){
    var hint = $("ppt-hint");
    if (!hint) return;
    if (showPpt || !n) { hint.hidden = true; hint.textContent = ""; return; }
    hint.hidden = false;
    hint.textContent = "";
    hint.appendChild(document.createTextNode("同じ条件で PPT（社内編集用）が " + n + " 件あります。"));
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = "表示する";
    b.addEventListener("click", function(){ setShowPpt(true); });
    hint.appendChild(b);
  }

  function renderChips(){
    var base = baseItems();
    var counts = {};
    base.forEach(function(it){ counts[it.category] = (counts[it.category] || 0) + 1; });
    var cats = Object.keys(counts).sort(function(a, b){ return catRank(a) - catRank(b); });

    chipsEl.textContent = "";
    var all = document.createElement("button");
    all.type = "button";
    all.className = "chip";
    all.setAttribute("aria-pressed", activeCat === null ? "true" : "false");
    all.textContent = "すべて";
    var an = document.createElement("span"); an.className = "n"; an.textContent = base.length;
    all.appendChild(an);
    all.addEventListener("click", function(){ activeCat = null; renderChips(); render(); });
    chipsEl.appendChild(all);

    cats.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", activeCat === c ? "true" : "false");
      b.textContent = c || "未分類";
      var nn = document.createElement("span"); nn.className = "n"; nn.textContent = counts[c];
      b.appendChild(nn);
      b.addEventListener("click", function(){
        activeCat = (activeCat === c) ? null : c;
        renderChips(); render();
      });
      chipsEl.appendChild(b);
    });

    var pptCount = items.filter(function(it){ return it.format === "PPT"; }).length;
    if (pptCount) {
      var tg = document.createElement("button");
      tg.type = "button";
      tg.className = "chip toggle";
      tg.id = "ppt-toggle";
      tg.setAttribute("aria-pressed", showPpt ? "true" : "false");
      tg.textContent = showPpt ? "PPT版を隠す" : "PPT版も表示";
      var tn = document.createElement("span"); tn.className = "n"; tn.textContent = pptCount;
      tg.appendChild(tn);
      tg.addEventListener("click", function(){ setShowPpt(!showPpt); });
      chipsEl.appendChild(tg);
    }

    var dl = $("cats");
    dl.textContent = "";
    CAT_ORDER.concat(cats).filter(function(v, i, a){ return v && a.indexOf(v) === i; }).forEach(function(c){
      var o = document.createElement("option");
      o.value = c;
      dl.appendChild(o);
    });
  }

  function renderSelbar(){
    var n = selected.size;
    selbar.hidden = n === 0;
    $("sel-n").textContent = String(n);
  }

  function selectedItems(){
    var byId = {};
    items.forEach(function(it){ byId[it.id] = it; });
    return sorted().filter(function(it){ return selected.has(it.id); });
  }

  /* ---------- dialog ---------- */
  function openDialog(it){
    editingId = it ? it.id : null;
    $("dlg-title").textContent = it ? "資料を編集" : "資料を追加";
    $("f-title").value = it ? it.title : "";
    $("f-url").value = it ? it.url : "";
    $("f-cat").value = it ? (it.category || "") : (activeCat || "");
    $("f-fmt").value = it ? (it.format || "") : "PDF";
    $("f-note").value = it ? (it.note || "") : "";
    $("f-tags").value = it ? (it.tags || "") : "";
    $("dlg-del").hidden = !it;
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(function(){ $("f-title").focus(); }, 30);
  }
  function closeDialog(){
    if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
  }

  $("add").addEventListener("click", function(){ openDialog(null); });
  $("dlg-cancel").addEventListener("click", closeDialog);
  $("dlg-x").addEventListener("click", closeDialog);

  $("dlg-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var title = $("f-title").value.trim();
    var url = $("f-url").value.trim();
    if (!title || !url) return;
    if (!db) { toast("保存先に接続できていないため、登録できません。"); return; }

    var body = {
      title: title,
      url: url,
      category: $("f-cat").value.trim() || "未分類",
      format: $("f-fmt").value,
      note: $("f-note").value.trim(),
      tags: $("f-tags").value.trim(),
      model: "",
      priceLabel: "",
      order: Date.now()
    };

    var id = editingId;
    if (id) {
      var cur = items.filter(function(x){ return x.id === id; })[0];
      if (cur) {
        body.order = typeof cur.order === "number" ? cur.order : body.order;
        body.model = cur.model || "";
        body.priceLabel = cur.priceLabel || "";
      }
    } else {
      id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    closeDialog();
    db.doc("materials/" + id).set(body).then(function(){
      toast(editingId ? "更新しました" : "追加しました");
    }).catch(function(e){
      toast("保存できませんでした（" + (e && e.code ? e.code : "エラー") + "）");
    });
  });

  $("dlg-del").addEventListener("click", function(){
    if (!editingId || !db) return;
    var cur = items.filter(function(x){ return x.id === editingId; })[0];
    if (!cur) return;
    if (!window.confirm("「" + cur.title + "」を一覧から削除します。よろしいですか？")) return;
    var id = editingId;
    closeDialog();
    db.doc("materials/" + id).delete().then(function(){
      selected.delete(id);
      renderSelbar();
      toast("削除しました");
    }).catch(function(){ toast("削除できませんでした"); });
  });

  /* ---------- search + shortcuts ---------- */
  qEl.addEventListener("input", function(){
    $("clear").hidden = !qEl.value;
    render();
  });
  $("clear").addEventListener("click", function(){
    qEl.value = ""; $("clear").hidden = true; render(); qEl.focus();
  });
  document.addEventListener("keydown", function(ev){
    var tag = (ev.target && ev.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea" || tag === "select";
    if (ev.key === "/" && !typing) { ev.preventDefault(); qEl.focus(); qEl.select(); }
    if (ev.key === "Escape" && ev.target === qEl && qEl.value) {
      qEl.value = ""; $("clear").hidden = true; render();
    }
  });
  qEl.addEventListener("keydown", function(ev){
    if (ev.key !== "Enter") return;
    var ts = terms();
    var hit = sorted().filter(function(it){ return matches(it, ts); })[0];
    if (hit) doCopy(ev.shiftKey ? line(hit) : hit.url, ev.shiftKey ? "先頭の資料を「名前＋URL」でコピーしました" : "先頭の資料のURLをコピーしました");
  });

  /* ---------- bulk copy ---------- */
  $("sel-copy-url").addEventListener("click", function(){
    var sel = selectedItems();
    if (!sel.length) return;
    doCopy(sel.map(function(it){ return it.url; }).join("\n"), sel.length + " 件のURLをコピーしました");
  });
  $("sel-copy-both").addEventListener("click", function(){
    var sel = selectedItems();
    if (!sel.length) return;
    doCopy(sel.map(line).join("\n\n"), sel.length + " 件の資料名とURLをコピーしました");
  });
  $("sel-clear").addEventListener("click", function(){
    selected.clear();
    renderSelbar();
    render();
  });

  /* ---------- data ---------- */
  function showNotice(msg){
    noticeEl.hidden = false;
    noticeEl.innerHTML = msg;
  }

  function adopt(snap){
    items = snap.docs.map(function(d){
      var v = d.data() || {};
      var it = {
        id: d.id,
        title: String(v.title || "(名称未設定)"),
        url: String(v.url || ""),
        category: String(v.category || "未分類"),
        format: v.format ? String(v.format) : "",
        note: v.note ? String(v.note) : "",
        tags: v.tags ? String(v.tags) : "",
        model: v.model ? String(v.model) : "",
        priceLabel: v.priceLabel ? String(v.priceLabel) : "",
        order: typeof v.order === "number" ? v.order : undefined
      };
      it._hay = haystack(it);
      return it;
    });
    loaded = true;
    renderChips();
    render();
  }

  var useDb = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("db")
    : Promise.resolve(null);

  useDb.then(function(handle){
    if (!handle) {
      loaded = true;
      items = [];
      showNotice("<b>資料データに接続できませんでした。</b>ページを再読み込みするか、共有元にアクセス権をご確認ください。");
      renderChips();
      render();
      return;
    }
    db = handle;
    db.collection("materials").onSnapshot(adopt, function(err){
      loaded = true;
      showNotice("<b>データの同期が止まりました（" + (err && err.code ? err.code : "不明") + "）。</b>ページを再読み込みしてください。");
      render();
    });
  }).catch(function(){
    loaded = true;
    showNotice("<b>資料データに接続できませんでした。</b>ページを再読み込みしてください。");
    render();
  });
})();
</script>
