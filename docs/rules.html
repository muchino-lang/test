<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ルール一覧（カテゴリ検索）</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<article class="doc doc--wide" data-file="ルール一覧" data-toolbar="custom">

  <a class="doc__back" href="index.html">← ドキュメント一覧へ</a>

  <h1>ルール一覧</h1>
  <p class="doc__meta">3つのドキュメントのルールを表にまとめたものです。キーワード・カテゴリ・ドキュメントで絞り込めます。</p>

  <div class="filters">
    <div class="filters__search">
      <label class="filters__label" for="rules-search">キーワード検索</label>
      <input id="rules-search" type="search" class="filters__input"
             placeholder="例：直帰、カレンダー、主任、1on1" autocomplete="off">
    </div>

    <div class="filters__group">
      <span class="filters__label" id="label-categories">カテゴリ</span>
      <div class="chips" id="rules-categories" role="group" aria-labelledby="label-categories"></div>
    </div>

    <div class="filters__group">
      <span class="filters__label" id="label-docs">ドキュメント</span>
      <div class="chips" id="rules-docs" role="group" aria-labelledby="label-docs"></div>
    </div>

    <div class="filters__status">
      <span id="rules-count" aria-live="polite"></span>
      <button type="button" id="rules-reset" class="doc__btn doc__btn--quiet" hidden>条件をクリア</button>
    </div>
  </div>

  <table class="rules-table">
    <colgroup>
      <col class="col-category">
      <col class="col-doc">
      <col class="col-target">
      <col class="col-item">
      <col class="col-content">
    </colgroup>
    <thead>
      <tr>
        <th scope="col">カテゴリ</th>
        <th scope="col">ドキュメント</th>
        <th scope="col">対象</th>
        <th scope="col">項目</th>
        <th scope="col">内容</th>
      </tr>
    </thead>
    <tbody id="rules-body"></tbody>
  </table>

  <noscript>
    <p class="note note--warn">このページの検索機能には JavaScript が必要です。各ドキュメントのページからも内容を確認できます。</p>
  </noscript>

</article>
<script src="data/rules.js"></script>
<script src="assets/export.js"></script>
<script src="assets/rules.js"></script>
</body>
</html>
