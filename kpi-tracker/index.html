<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テレアポKPIトラッカー</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f2ee;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300;
  --accent:#2a78d6;
  --radius:14px;
  --font: system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good-text:#0ca30c; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-text:#0ca30c; --accent:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--plane);border-bottom:1px solid var(--border)}
.hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--s1)}
.hd .spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{background:var(--surface-2)}

/* level bar in header */
.lvbox{display:flex;align-items:center;gap:10px;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 12px}
.lvbadge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;height:38px;border-radius:9px;background:linear-gradient(160deg,var(--s1),var(--s3));color:#fff;font-weight:800;line-height:1}
.lvbadge small{font-size:9px;font-weight:600;opacity:.9}
.lvmeta{flex:1;min-width:110px}
.lvmeta .t{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.xpbar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:3px;border:1px solid var(--border)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--s3));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap;border-radius:8px 8px 0 0}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:14px}
.card h2{font-size:14px;letter-spacing:.02em;color:var(--ink-2);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- stat tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.tile .val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-left:2px}
.tile .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block}
.up{color:var(--good-text);font-weight:700}
.down{color:var(--crit);font-weight:700}

/* meter */
.meter{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- forms ---------- */
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:var(--crit)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* stepper */
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper input{text-align:center;font-size:26px;font-weight:800;padding:6px}
.stepper button{width:52px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.stepper button:hover{background:var(--accent);color:#fff;border-color:transparent}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2)}
.pill.ok{color:var(--good-text);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.ng{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{background:var(--surface-2);font-size:12px;color:var(--ink-2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* ---------- quests / badges ---------- */
.quest{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.quest.done{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.quest .ic{font-size:20px;width:26px;text-align:center}
.quest .tx{flex:1;min-width:0}
.quest .tx b{display:block;font-size:13.5px}
.quest .tx span{font-size:12px;color:var(--ink-2)}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);text-align:center;opacity:.38;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:linear-gradient(160deg,color-mix(in srgb,var(--s4) 18%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--s4) 45%,transparent)}
.badge .e{font-size:26px;line-height:1}
.badge b{font-size:12px}
.badge span{font-size:10.5px;color:var(--ink-2);line-height:1.35}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}

/* rank list */
.rank{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--grid)}
.rank:last-child{border-bottom:0}
.rank .pos{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--border)}
.rank.p1 .pos{background:linear-gradient(160deg,#eda100,#eb6834);color:#fff;border-color:transparent}
.rank .nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:700}

/* chart */
.chartbox{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tt{position:fixed;pointer-events:none;z-index:99;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.16);opacity:0;transition:opacity .12s;max-width:240px}
.tt b{display:block;margin-bottom:3px;font-size:12px}
.tt .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tt .r span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* appointment cards */
.appt{border:1px solid var(--border);border-radius:13px;padding:13px;background:var(--surface-2);margin-bottom:10px}
.appt .hd2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.appt .no{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--s3);color:#fff}
.appt .hd2 b{flex:1;font-size:13px}
.appt .grid{gap:10px}
.appt .field{margin-bottom:0}
.err{display:block;color:var(--crit);font-size:12.5px;font-weight:700;margin-top:6px}
.err:empty{display:none}
input.bad,textarea.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,var(--surface-2))}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.onb{text-align:center;padding:34px 20px}
.onb .e{font-size:46px}
.onb h3{font-size:19px;margin:8px 0 6px}
.onb p{color:var(--ink-2);font-size:14px;margin:0 auto 16px;max-width:460px}
.steps{display:grid;gap:10px;max-width:520px;margin:0 auto 18px;text-align:left}
.steps div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.steps b{display:grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);padding:5px 0}
.cal-h.sat{color:var(--s1)} .cal-h.sun{color:var(--crit)}
.cal-c{min-height:88px;border:1px solid var(--border);border-radius:10px;padding:5px 6px;background:var(--surface);cursor:pointer;overflow:hidden;transition:box-shadow .15s}
.cal-c:hover{box-shadow:0 0 0 2px var(--accent) inset}
.cal-c.empty-c{background:transparent;border-color:transparent;cursor:default;min-height:0}
.cal-c.sat{background:color-mix(in srgb,var(--s1) 5%,var(--surface))}
.cal-c.sun{background:color-mix(in srgb,var(--crit) 5%,var(--surface))}
.cal-c.today{border-color:var(--accent);border-width:2px}
.cal-d{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.cal-d .tdot{font-size:9.5px;font-weight:800;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px}
.cal-v{display:flex;gap:6px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);margin-top:2px;flex-wrap:wrap}
.cal-v .ap{color:var(--good-text);font-weight:800}
.cal-v.miss{color:var(--muted);font-size:10.5px;font-style:italic}
.cal-p{margin-top:3px;font-size:10.5px;font-weight:700;line-height:1.35;background:var(--s4);color:#1a1a19;border-radius:5px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  .cal{gap:3px}
  .cal-c{min-height:66px;padding:3px 4px;border-radius:8px}
  .cal-d{font-size:11px} .cal-v{font-size:10px;gap:3px} .cal-p{font-size:9px;padding:1px 3px}
}

/* summary text */
pre.sum{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:13.5px;line-height:1.75;margin:0}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--plane);padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:150;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#levelup{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);z-index:180;padding:20px}
#levelup.on{display:grid}
#levelup .box{background:var(--surface);border-radius:20px;padding:28px 32px;text-align:center;max-width:340px;border:1px solid var(--border);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#levelup .box .e{font-size:52px}
#levelup .box h3{font-size:22px;margin:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.sec-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand"><span class="dot"></span>テレアポ KPI トラッカー</div>
    <div class="lvbox" id="lvbox"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="テーマ切替">🌓</button>
  </div>
  <div class="wrap" style="padding-bottom:0">
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="tt" id="tt"></div>
<div id="toast"></div>
<div id="levelup"><div class="box"><div class="e">🎉</div><h3 id="luTitle"></h3><p id="luDesc" style="color:var(--ink-2);font-size:14px"></p><button class="btn" onclick="document.getElementById('levelup').classList.remove('on')">やった！</button></div></div>

<script>
"use strict";
/* =========================================================================
   テレアポ KPI トラッカー  —  単一HTML / 外部依存なし / localStorage保存
   ========================================================================= */

const LS_KEY = 'teleapo_kpi_v1';
const TODAY = () => new Date().toISOString().slice(0,10);

/* ---------- 既定設定 ---------- */
const DEFAULTS = {
  settings:{
    periodStart:'2026-07-01',
    periodEnd:'2026-11-30',
    apptGoal:50,          // 期間の目標アポ数
    apptRateGoal:0.30,    // 目標アポ率（架電→アポ）
    closeRate:0.20,       // 成約率
    unitsPerDeal:40,      // 1校あたり平均販売台数
    grossPerUnit:30000,   // 粗利単価
    workWeekend:false     // 土日を営業日に含めるか
  },
  members:[
    {id:'m_kondo',   name:'近藤',        slot:1, dailyCall:5, dailyAppt:1, active:true,  kind:'社内',
     mission:{label:'訪問商談アポ', target:30, from:'2026-07-01', to:'2026-08-31'}},
    {id:'m_second',  name:'メンバー2',   slot:2, dailyCall:5, dailyAppt:1, active:false, kind:'社内'},
    {id:'m_partner', name:'パートナー営業', slot:3, dailyCall:0, dailyAppt:1, active:true,  kind:'パートナー'},
    {id:'m_self',    name:'自分',        slot:4, dailyCall:0, dailyAppt:0, active:false, kind:'社内'}
  ],
  // records: {id,date,memberId,calls,appts,note,appointments:[
  //   {company, apptAt:'YYYY-MM-DDTHH:MM', contact, tel, email, content}
  // ]}
  records:[],
  meta:{maxLevelSeen:{}}
};

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const p = JSON.parse(raw);
    return {
      settings:{...DEFAULTS.settings, ...(p.settings||{})},
      members: (p.members&&p.members.length)? p.members : structuredClone(DEFAULTS.members),
      records: (p.records||[]).map(migrateRecord),
      meta:{maxLevelSeen:{}, ...(p.meta||{})}
    };
  }catch(e){ console.warn(e); return structuredClone(DEFAULTS); }
}
/* 旧形式（アポ先をテキスト1行で保持）→ 構造化アポ情報へ移行 */
function migrateRecord(r){
  if(Array.isArray(r.appointments)) return r;
  const lines = String(r.detail||'').split(/[\n\/／]/).map(s=>s.trim()).filter(Boolean);
  const n = Math.max(+r.appts||0, 0);
  const appointments = [];
  for(let i=0;i<n;i++) appointments.push(blankAppt({company: lines[i]||''}));
  delete r.detail;
  return {...r, appointments};
}
function blankAppt(o={}){ return {company:'', apptAt:'', contact:'', tel:'', email:'', content:'', ...o}; }
/* 全アポを1次元に展開（記録日・担当者つき） */
function allAppointments(filter={}){
  const out=[];
  recs(filter).forEach(r=>(r.appointments||[]).forEach((a,i)=>{
    out.push({...a, recId:r.id, idx:i, date:r.date, memberId:r.memberId});
  }));
  return out;
}
function apptLabel(a){
  if(!a.apptAt) return '日時未定';
  const [dt,tm] = a.apptAt.split('T');
  return `${jp(dt)} ${tm||''}`.trim();
}
function isUpcoming(a){ return a.apptAt && a.apptAt.slice(0,10) >= TODAY(); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

/* ---------- 汎用ユーティリティ ---------- */
const WD = ['日','月','火','水','木','金','土'];
const fmt = n => (Math.round(n*10)/10).toLocaleString('ja-JP');
/* 1未満は小数2桁まで見せる（残ペースが「0」に潰れないように） */
const fine = n => n>0 && n<1 ? n.toFixed(2) : fmt(n);
const int = n => Math.round(n).toLocaleString('ja-JP');
const pct = (a,b) => b>0 ? (a/b*100) : 0;
const pctS = (a,b) => b>0 ? (a/b*100).toFixed(1)+'%' : '—';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function d(dateStr){ const [y,m,dd]=dateStr.split('-').map(Number); return new Date(y,m-1,dd); }
function jp(dateStr){ const t=d(dateStr); return `${t.getMonth()+1}/${t.getDate()}(${WD[t.getDay()]})`; }
function jpFull(dateStr){ const t=d(dateStr); return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}(${WD[t.getDay()]})`; }
function addDays(dateStr,n){ const t=d(dateStr); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); }
function isWorkday(dateStr){ if(S.settings.workWeekend) return true; const w=d(dateStr).getDay(); return w!==0&&w!==6; }
function man(yen){ return (yen/10000); }         // 円 → 万円
function moneyS(yen){
  if(yen>=100000000) return (yen/100000000).toFixed(2).replace(/\.?0+$/,'')+'億円';
  return int(man(yen))+'万円';
}
function memberById(id){ return S.members.find(m=>m.id===id) || {id,name:'(削除済)',slot:4}; }
function slotVar(slot){ return `var(--s${((slot-1)%4)+1})`; }
function activeMembers(){ return S.members.filter(m=>m.active); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- 収益モデル ---------- */
// 1アポあたりの想定粗利 = 成約率 × 平均台数 × 粗利単価
function grossPerAppt(){ const s=S.settings; return s.closeRate*s.unitsPerDeal*s.grossPerUnit; }
function deals(appts){ return appts*S.settings.closeRate; }
function gross(appts){ return appts*grossPerAppt(); }

/* ---------- 集計 ---------- */
function recs(filter={}){
  return S.records.filter(r=>{
    if(filter.memberId && r.memberId!==filter.memberId) return false;
    if(filter.from && r.date < filter.from) return false;
    if(filter.to   && r.date > filter.to  ) return false;
    return true;
  });
}
function agg(list){
  const calls = list.reduce((a,r)=>a+(+r.calls||0),0);
  const appts = list.reduce((a,r)=>a+(+r.appts||0),0);
  return {calls, appts, rate:pct(appts,calls), deals:deals(appts), gross:gross(appts), days:new Set(list.map(r=>r.date)).size};
}
function byDate(list){
  const m=new Map();
  list.forEach(r=>{
    const o=m.get(r.date)||{date:r.date,calls:0,appts:0};
    o.calls+=+r.calls||0; o.appts+=+r.appts||0; m.set(r.date,o);
  });
  return [...m.values()].sort((a,b)=>a.date<b.date?-1:1);
}
function dateRangeArr(from,to){
  const out=[]; let c=from; let guard=0;
  while(c<=to && guard++<800){ out.push(c); c=addDays(c,1); }
  return out;
}
/* 営業日ベースの連続稼働日数（土日は連続を切らさない） */
function streak(memberId){
  const set = new Set(recs({memberId}).filter(r=>(+r.calls||0)>0||(+r.appts||0)>0).map(r=>r.date));
  let cur = TODAY(), n = 0, guard=0;
  if(!set.has(cur)) cur = addDays(cur,-1);       // 当日未入力でも前日までの連続は生かす
  while(guard++<400){
    if(!isWorkday(cur)){ cur=addDays(cur,-1); continue; }
    if(set.has(cur)){ n++; cur=addDays(cur,-1); } else break;
  }
  return n;
}
/* アポ獲得の連続日数（獲れた営業日の連鎖） */
function apptStreak(memberId){
  const set = new Set(recs({memberId}).filter(r=>(+r.appts||0)>0).map(r=>r.date));
  let cur = TODAY(), n=0, guard=0;
  if(!set.has(cur)) cur = addDays(cur,-1);
  while(guard++<400){
    if(!isWorkday(cur)){ cur=addDays(cur,-1); continue; }
    if(set.has(cur)){ n++; cur=addDays(cur,-1); } else break;
  }
  return n;
}

/* ---------- ミッション（期限付きの個別目標） ---------- */
function workdaysBetween(from,to){ return dateRangeArr(from,to).filter(isWorkday).length; }
function missionStats(m){
  const ms = m.mission;
  if(!ms || !ms.target) return null;
  const got = agg(recs({memberId:m.id, from:ms.from, to:ms.to})).appts;
  const remain = Math.max(0, ms.target - got);
  const today = TODAY();
  const overdue = today > ms.to;
  // 残営業日（今日を含む・期限まで）
  const leftDays = overdue ? 0 : workdaysBetween(today < ms.from ? ms.from : today, ms.to);
  const totalDays = workdaysBetween(ms.from, ms.to) || 1;
  const elapsed = Math.min(totalDays, workdaysBetween(ms.from, today < ms.to ? today : ms.to));
  const shouldHave = ms.target * (elapsed/totalDays);      // 今日時点であるべき件数
  const perDay = leftDays>0 ? remain/leftDays : remain;
  const perWeek = perDay * 5;
  const needCalls = Math.ceil(remain / (S.settings.apptRateGoal||0.3));
  return {...ms, got, remain, leftDays, totalDays, elapsed, shouldHave,
          diff:got-shouldHave, perDay, perWeek, needCalls, overdue,
          done:got>=ms.target, ratio:pct(got,ms.target)};
}
function missionCard(m){
  const x = missionStats(m); if(!x) return '';

              : x.diff>=0 ? {c:'var(--good)', t:'✅ 予定どおり', p:'ok'}
                          : {c:'var(--warn)', t:'⚠ 遅れ気味', p:'ng'};
  return `<div class="card" style="margin-top:14px;border-color:${state.c}">
    <h2>🎯 ${esc(m.name)}のミッション：${esc(x.label)} ${x.target}件<span class="spacer"></span>
      <span class="pill ${state.p}">${state.t}</span>
      <span class="pill">期限 ${jpFull(x.to)}</span></h2>
    <div class="meter" style="height:16px;position:relative">
      <i style="width:${Math.min(100,x.ratio).toFixed(1)}%;background:linear-gradient(90deg,var(--s1),${state.c})"></i>
      <span style="position:absolute;left:${Math.min(99,pct(x.elapsed,x.totalDays)).toFixed(1)}%;top:-3px;width:2px;height:22px;background:var(--ink);opacity:.55" title="本日の想定ペース位置"></span>
    </div>
    <div class="grid g4" style="margin-top:14px">
      <div><div class="lbl" style="font-size:12px;color:var(--muted);font-weight:600">獲得済み</div>
        <div style="font-size:26px;font-weight:800">${int(x.got)}<small style="font-size:13px"> / ${x.target}件</small></div>
        <div class="sub" style="font-size:12px;color:var(--ink-2)">達成率 ${x.ratio.toFixed(1)}%</div></div>
      <div><div class="lbl" style="font-size:12px;color:var(--muted);font-weight:600">残り</div>
        <div style="font-size:26px;font-weight:800">${int(x.remain)}<small style="font-size:13px">件</small></div>
        <div class="sub" style="font-size:12px;color:var(--ink-2)">残 ${x.leftDays}営業日</div></div>
      <div><div class="lbl" style="font-size:12px;color:var(--muted);font-weight:600">必要ペース</div>
        <div style="font-size:26px;font-weight:800">${x.done?'—':fine(x.perDay)}<small style="font-size:13px">件/日</small></div>
        <div class="sub" style="font-size:12px;color:var(--ink-2)">${x.done?'達成済み':`週 ${fine(x.perWeek)}件 ・ 架電 約${int(x.needCalls)}件`}</div></div>
      <div><div class="lbl" style="font-size:12px;color:var(--muted);font-weight:600">ペース差</div>
        <div style="font-size:26px;font-weight:800" class="${x.diff>=0?'up':'down'}">${x.diff>=0?'+':''}${fmt(x.diff)}<small style="font-size:13px">件</small></div>
        <div class="sub" style="font-size:12px;color:var(--ink-2)">本日の想定 ${fmt(x.shouldHave)}件に対し</div></div>
    </div>
  </div>`;
}

/* ---------- XP / レベル ---------- */
const XP_CALL = 10, XP_APPT = 250, XP_DAY_BONUS = 50, XP_QUEST = 100;
function xpOf(memberId){
  const list = recs(memberId?{memberId}:{});
  let xp = 0;
  const days = byDate(list);
  days.forEach(day=>{
    xp += day.calls*XP_CALL + day.appts*XP_APPT;
    xp += XP_DAY_BONUS;                                   // 入力継続ボーナス
    if(day.calls>0 && pct(day.appts,day.calls) >= S.settings.apptRateGoal*100) xp += XP_QUEST; // 目標アポ率達成
  });
  return Math.round(xp);
}
// レベルL到達に必要な累計XP: 400*L*(L+1)/2 相当のゆるやかな曲線
function xpForLevel(L){ return Math.round(200*L*(L+1)); }
function levelOf(xp){
  let L=1; while(xp >= xpForLevel(L) && L<99) L++;
  const cur = L>1? xpForLevel(L-1):0, next = xpForLevel(L);
  return {level:L, cur, next, into:xp-cur, need:next-cur, ratio:(xp-cur)/(next-cur)};
}
const RANKS = [
  [1,'ルーキー','🌱'],[4,'ブロンズ','🥉'],[8,'シルバー','🥈'],[12,'ゴールド','🥇'],

];
function rankOf(level){ let r=RANKS[0]; RANKS.forEach(x=>{ if(level>=x[0]) r=x; }); return {name:r[1], emoji:r[2]}; }

function badgeStats(memberId){
  const list = recs(memberId?{memberId}:{});
  const a = agg(list);
  const days = byDate(list);
  const bestDayAppt = days.reduce((m,x)=>Math.max(m,x.appts),0);
  // 最長連続営業日
  let bestStreak=0, run=0, prev=null;
  const actDays = days.filter(x=>x.calls>0||x.appts>0).map(x=>x.date);
  actDays.forEach(dt=>{
    if(prev){
      let step=addDays(prev,1), ok=false, g=0;
      while(g++<10){ if(!isWorkday(step)){ step=addDays(step,1); continue; } ok=(step===dt); break; }
      run = ok? run+1 : 1;
    } else run=1;
    prev=dt; bestStreak=Math.max(bestStreak,run);
  });
  return {...a, bestDayAppt, bestStreak};
}

/* ---------------- チャート（自前SVG） ---------------- */
const TT = document.getElementById('tt');
function showTT(html,e){ TT.innerHTML=html; TT.style.opacity=1;
  const x=Math.min(e.clientX+14, innerWidth-250), y=Math.max(10,e.clientY-14);
  TT.style.left=x+'px'; TT.style.top=y+'px'; }
function hideTT(){ TT.style.opacity=0; }

function seriesForRange(){
  const {from,to} = rangeBounds();
  const who = dashMember==='all'? null : dashMember;
  const list = recs({...(who?{memberId:who}:{}), from, to});
  const map = new Map(byDate(list).map(x=>[x.date,x]));
  let dates = dateRangeArr(from, to>TODAY()&&dashRange!=='period' ? TODAY() : to);
  if(dates.length>70){ // 期間全体は営業日のみに間引き
    dates = dates.filter(dt=>isWorkday(dt)||map.has(dt));
  }
  return dates.map(dt=>({date:dt, calls:map.get(dt)?.calls||0, appts:map.get(dt)?.appts||0, has:map.has(dt)}));
}
function mountDash(){
  const hostD=document.getElementById('chartDaily');
  if(!hostD) return;                       // オンボーディング表示中はグラフなし
  const data = seriesForRange();
  drawDaily(hostD, data);
  drawRate(document.getElementById('chartRate'), data);
  drawCum(document.getElementById('chartCum'));
}
function axisTicks(max,n=4){
  if(max<=0) return [0,1];
  const raw = max/n, mag = Math.pow(10,Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw) || mag*10;
  const out=[]; for(let v=0; v<=max+step*0.01; v+=step) out.push(v);
  if(out[out.length-1]<max) out.push(out[out.length-1]+step);
  return out;
}
function drawDaily(host, data){
  const W=560,H=230,ML=38,MR=8,MT=10,MB=30;
  const iw=W-ML-MR, ih=H-MT-MB;
  const max = Math.max(1, ...data.map(x=>Math.max(x.calls,x.appts)));
  const ticks = axisTicks(max); const top = ticks[ticks.length-1];
  const n=data.length||1, bw=iw/n, gw=Math.max(2,Math.min(16,(bw-4)/2));
  const y=v=>MT+ih-(v/top)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日次の架電数とアポ数">`;
  ticks.forEach(t=>{ s+=`<line x1="${ML}" x2="${W-MR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${ML-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${int(t)}</text>`; });
  data.forEach((p,i)=>{
    const cx=ML+bw*i+bw/2;
    const bars=[[p.calls,'var(--s1)',-gw-1],[p.appts,'var(--s3)',1]];
    bars.forEach(([v,c,off])=>{ if(v<=0) return;
      const h=Math.max(2,(v/top)*ih);
      s+=`<rect x="${(cx+off).toFixed(1)}" y="${(MT+ih-h).toFixed(1)}" width="${gw}" height="${h.toFixed(1)}" rx="4" fill="${c}"/>`; });
    if(p.appts>0){ s+=`<text x="${cx+1+gw/2}" y="${(y(p.appts)-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink-2)">${p.appts}</text>`; }
    if(n<=32 && (i%Math.ceil(n/12)===0)) s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${jp(p.date).replace(/\(.\)/,'')}</text>`;
    s+=`<rect x="${ML+bw*i}" y="${MT}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  s+=`<line x1="${ML}" x2="${W-MR}" y1="${MT+ih}" y2="${MT+ih}" stroke="var(--axis)" stroke-width="1"/></svg>`;
  host.innerHTML=s;
  host.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const p=data[+r.dataset.i];
      showTT(`<b>${jpFull(p.date)}</b>
        <div class="r"><span>📞 架電</span><span>${p.calls} 件</span></div>
        <div class="r"><span>🤝 アポ</span><span>${p.appts} 件</span></div>
        <div class="r"><span>アポ率</span><span>${pctS(p.appts,p.calls)}</span></div>`,e); });
    r.addEventListener('mouseleave',hideTT);
  });
}
function drawRate(host,data){
  const W=560,H=230,ML=38,MR=10,MT=10,MB=30;
  const iw=W-ML-MR, ih=H-MT-MB;
  const pts = data.filter(p=>p.calls>0).map(p=>({...p, rate:pct(p.appts,p.calls)}));
  const goal = S.settings.apptRateGoal*100;
  const top = Math.max(60, goal*1.6, ...pts.map(p=>p.rate))*1.05;
  const y=v=>MT+ih-(v/top)*ih;
  const n=data.length||1; const x=i=>ML+(n===1?iw/2:(iw*i/(n-1)));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="日次アポ率">`;
  axisTicks(top,4).forEach(t=>{ if(t>top) return;
    s+=`<line x1="${ML}" x2="${W-MR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
        <text x="${ML-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t.toFixed(0)}%</text>`; });
  s+=`<line x1="${ML}" x2="${W-MR}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--axis)" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="${W-MR}" y="${y(goal)-6}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--ink-2)">目標 ${goal.toFixed(0)}%</text>`;
  if(pts.length){
    const idx = new Map(data.map((p,i)=>[p.date,i]));
    const path = pts.map((p,k)=>`${k?'L':'M'}${x(idx.get(p.date)).toFixed(1)},${y(p.rate).toFixed(1)}`).join(' ');
    s+=`<path d="${path}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{ const cx=x(idx.get(p.date)), cy=y(p.rate);
      s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>`; });
    const last = pts[pts.length-1];
    s+=`<text x="${(x(idx.get(last.date))-6).toFixed(1)}" y="${(y(last.rate)-10).toFixed(1)}" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">${last.rate.toFixed(1)}%</text>`;
  } else {
    s+=`<text x="${W/2}" y="${MT+ih/2}" text-anchor="middle" font-size="12" fill="var(--muted)">架電実績がまだありません</text>`;
  }
  data.forEach((p,i)=>{ s+=`<rect x="${x(i)-iw/n/2}" y="${MT}" width="${iw/n}" height="${ih}" fill="transparent" data-i="${i}"/>`; });
  s+=`<line x1="${ML}" x2="${W-MR}" y1="${MT+ih}" y2="${MT+ih}" stroke="var(--axis)"/></svg>`;
  host.innerHTML=s;
  host.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const p=data[+r.dataset.i];
      showTT(`<b>${jpFull(p.date)}</b><div class="r"><span>アポ率</span><span>${pctS(p.appts,p.calls)}</span></div>
              <div class="r"><span>架電/アポ</span><span>${p.calls} / ${p.appts}</span></div>`,e); });
    r.addEventListener('mouseleave',hideTT);
  });
}
function drawCum(host){
  const who = dashMember==='all'? null : dashMember;
  const s0=S.settings.periodStart, s1=S.settings.periodEnd;
  const list = recs({...(who?{memberId:who}:{}), from:s0, to:s1});
  const map = new Map(byDate(list).map(x=>[x.date,x]));
  const days = dateRangeArr(s0,s1);
  const wds = days.filter(isWorkday).length || 1;
  const goal = S.settings.apptGoal;
  let cum=0; const series = days.map((dt,i)=>{ cum += map.get(dt)?.appts||0;
    return {date:dt, cum, pace: goal * (days.slice(0,i+1).filter(isWorkday).length / wds), future: dt>TODAY()}; });
  const W=560,H=230,ML=34,MR=10,MT=12,MB=26, iw=W-ML-MR, ih=H-MT-MB;
  const top = Math.max(goal, cum)*1.08 || 1;
  const y=v=>MT+ih-(v/top)*ih, x=i=>ML+iw*i/Math.max(1,series.length-1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="累計アポ数と目標ペース">`;
  axisTicks(top,4).forEach(t=>{ if(t>top) return;
    s+=`<line x1="${ML}" x2="${W-MR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
        <text x="${ML-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${int(t)}</text>`; });
  s+=`<path d="${series.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.pace).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--axis)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const real = series.filter(p=>!p.future);
  if(real.length){
    const dpath = real.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.cum).toFixed(1)}`).join(' ');
    s+=`<path d="${dpath} L${x(real.length-1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z" fill="var(--s1)" opacity="0.10"/>`;
    s+=`<path d="${dpath}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linejoin="round"/>`;
    const last=real[real.length-1];
    s+=`<circle cx="${x(real.length-1).toFixed(1)}" cy="${y(last.cum).toFixed(1)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${(x(real.length-1)+8).toFixed(1)}" y="${(y(last.cum)-8).toFixed(1)}" font-size="11.5" font-weight="800" fill="var(--ink)">${int(last.cum)}件</text>`;
  }
  // 月ラベル
  let lastM='';
  series.forEach((p,i)=>{ const mm=p.date.slice(0,7); if(mm!==lastM){ lastM=mm;
    s+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="9.5" fill="var(--muted)" text-anchor="middle">${+mm.slice(5)}月</text>`; }});
  s+=`<line x1="${ML}" x2="${W-MR}" y1="${MT+ih}" y2="${MT+ih}" stroke="var(--axis)"/>`;
  series.forEach((p,i)=>{ if(i%3) return; s+=`<rect x="${(x(i)-3).toFixed(1)}" y="${MT}" width="6" height="${ih}" fill="transparent" data-i="${i}"/>`; });
  s+=`</svg>`;
  host.innerHTML=s;
  host.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mousemove',e=>{ const p=series[+r.dataset.i];
      showTT(`<b>${jpFull(p.date)}</b>
        <div class="r"><span>累計アポ</span><span>${p.future?'—':int(p.cum)+' 件'}</span></div>
        <div class="r"><span>目標ペース</span><span>${fmt(p.pace)} 件</span></div>
        <div class="r"><span>差分</span><span>${p.future?'—':(p.cum-p.pace>=0?'+':'')+fmt(p.cum-p.pace)+' 件'}</span></div>`,e); });
    r.addEventListener('mouseleave',hideTT);
  });
}

      <button class="btn" id="saveBtn" onclick="saveRecord()">${ex?'💾 更新する':'💾 保存する'}</button>

  <div class="card">
    <h2>📅 直近7営業日の入力状況（${esc(memberById(inputMember).name)}）</h2>

}
function mountInput(){
  renderApptCards(); liveCalc();
  // innerHTML で差し込んだ要素には autofocus が効かないので明示的に当てる
  const el=document.getElementById('iCalls');
  // スマホ・タブレットでは勝手にキーボードが出ないよう当てない
  if(el && !matchMedia('(hover:none), (pointer:coarse)').matches){ el.focus(); el.select(); }
}
function step(id,n){
  const el=document.getElementById(id); el.value=Math.max(0,(+el.value||0)+n);
  if(id==='iAppts') syncApptCount(); else liveCalc();
}
function bump(id,n){ step(id,n); }

/* ---- アポ明細カード ---- */
const APPT_FIELDS = [
  ['company','会社・学校名','text','例）大阪産業大学',true],
  ['apptAt','アポ日時','datetime-local','',false],
  ['contact','先方担当者名','text','例）情報システム課 田中様',false],
  ['tel','連絡先（電話）','tel','例）06-1234-5678',false],
  ['email','メールアドレス','email','例）tanaka@example.ac.jp',false],
  ['content','商談内容・メモ','text','例）PC40台の更新時期。次回デモ希望',false]
];
function syncApptDraftFromDOM(){
  document.querySelectorAll('#apptCards [data-ai]').forEach(el=>{
    const i=+el.dataset.ai, k=el.dataset.ak;
    if(apptDraft[i]) apptDraft[i][k]=el.value;
  });
}
function renderApptCards(){
  const host=document.getElementById('apptCards'); if(!host) return;
  if(!apptDraft.length){
    host.innerHTML=`<div class="empty" style="border:1px dashed var(--border);border-radius:12px;padding:18px">
      アポ獲得数を1以上にすると、アポ内容の入力欄が出ます。</div>`;
    return;
  }
  host.innerHTML = apptDraft.map((a,i)=>`
    <div class="appt">
      <div class="hd2"><span class="no">${i+1}</span><b>アポ ${i+1}件目</b>
        <button class="btn sec sm" type="button" tabindex="-1" onclick="removeAppt(${i})">削除</button></div>
      <div class="grid g2">
        ${APPT_FIELDS.map(([k,label,type,ph,req])=>`
          <div class="field"${k==='content'?' style="grid-column:1/-1"':''}>
            <label class="f">${label}${req?' <span style="color:var(--crit)">*</span>':''}</label>
            <input type="${type}" data-ai="${i}" data-ak="${k}" value="${esc(a[k]||'')}"
                   placeholder="${ph}" oninput="onApptInput()">
          </div>`).join('')}
      </div>
    </div>`).join('');
}
function onApptInput(){ syncApptDraftFromDOM(); validate(); }
function addAppt(){
  syncApptDraftFromDOM();
  apptDraft.push(blankAppt());
  document.getElementById('iAppts').value = apptDraft.length;
  renderApptCards(); liveCalc(); focusAppt(apptDraft.length-1);
}
function removeAppt(i){
  syncApptDraftFromDOM();
  const a=apptDraft[i];
  const filled = a && Object.values(a).some(v=>String(v||'').trim());
  if(filled && !confirm(`${a.company||`${i+1}件目`} の入力内容を削除しますか？`)) return;
  apptDraft.splice(i,1);
  document.getElementById('iAppts').value = apptDraft.length;
  renderApptCards(); liveCalc();
}
function syncApptCount(){
  syncApptDraftFromDOM();
  const n = Math.max(0, +document.getElementById('iAppts').value||0);
  if(n > apptDraft.length){ while(apptDraft.length<n) apptDraft.push(blankAppt()); }
  else if(n < apptDraft.length){
    // 末尾から減らす。入力済みのカードを消す場合だけ確認する
    while(apptDraft.length>n){
      const a=apptDraft[apptDraft.length-1];
      if(Object.values(a).some(v=>String(v||'').trim()) &&
         !confirm(`入力済みの「${a.company||'未入力のアポ'}」を削除して ${n}件にしますか？`)){
        document.getElementById('iAppts').value = apptDraft.length; break;
      }
      apptDraft.pop();
    }
  }
  renderApptCards(); liveCalc();
}
function focusAppt(i){ document.querySelector(`#apptCards [data-ai="${i}"][data-ak="company"]`)?.focus(); }
function focusFirstAppt(){ if(apptDraft.length) focusAppt(0); else document.getElementById('iNote')?.focus(); }

/* ---- インラインバリデーション ---- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function validate(){
  const c=+document.getElementById('iCalls')?.value||0;
  const a=+document.getElementById('iAppts')?.value||0;
  const errs=[];
  const eA=document.getElementById('errAppts'), eS=document.getElementById('errSave');
  const iA=document.getElementById('iAppts');
  if(!eA) return true;

  // ① アポ数 > 架電数
  let msg='';
  if(a>c){ msg=`架電数（${c}件）より多いアポ数は入力できません`; errs.push(msg); }
  eA.textContent=msg; iA.classList.toggle('bad', !!msg);

  // ② 必須項目・形式チェック
  document.querySelectorAll('#apptCards [data-ai]').forEach(el=>{
    const k=el.dataset.ak, v=el.value.trim(); let bad=false;
    if(k==='company' && !v){ bad=true; }
    if(k==='email' && v && !EMAIL_RE.test(v)){ bad=true; }
    el.classList.toggle('bad', bad);
  });
  const noName = apptDraft.some(x=>!String(x.company||'').trim());
  if(noName) errs.push('アポの「会社・学校名」は必須です');
  const badMail = apptDraft.find(x=>x.email && !EMAIL_RE.test(x.email));
  if(badMail) errs.push(`メールアドレスの形式を確認してください（${badMail.email}）`);

  eS.textContent = errs.length ? '⚠ '+errs.join(' / ') : '';
  const btn=document.getElementById('saveBtn');
  if(btn) btn.disabled = errs.length>0;
  return errs.length===0;
}

function liveCalc(){
  const c=+document.getElementById('iCalls')?.value||0, a=+document.getElementById('iAppts')?.value||0;
  const box=document.getElementById('liveCard'); if(!box) return;
  validate();
  const g=S.settings.apptRateGoal*100, r=pct(a,c);
  const m=memberById(inputMember);
  const xp=c*XP_CALL+a*XP_APPT+XP_DAY_BONUS+((c>0&&r>=g)?XP_QUEST:0);
  box.innerHTML=`<div class="grid g4" style="gap:10px">
    <div><div class="lbl" style="font-size:11.5px;color:var(--muted);font-weight:600">アポ率</div>
      <div style="font-size:24px;font-weight:800">${c?r.toFixed(1)+'%':'—'}</div>
      <div style="font-size:11.5px">${c? (r>=g?`<span class="up">目標クリア</span>`:`<span class="down">目標まで ${(g-r).toFixed(1)}pt</span>`):'<span style="color:var(--muted)">—</span>'}</div></div>
    <div><div class="lbl" style="font-size:11.5px;color:var(--muted);font-weight:600">想定成約</div>
      <div style="font-size:24px;font-weight:800">${fmt(deals(a))}<small style="font-size:12px">校</small></div>
      <div style="font-size:11.5px;color:var(--ink-2)">成約率 ${(S.settings.closeRate*100).toFixed(0)}%</div></div>
    <div><div class="lbl" style="font-size:11.5px;color:var(--muted);font-weight:600">想定粗利</div>
      <div style="font-size:24px;font-weight:800">${moneyS(gross(a))}</div>
      <div style="font-size:11.5px;color:var(--ink-2)">1アポ ${moneyS(grossPerAppt())}</div></div>
    <div><div class="lbl" style="font-size:11.5px;color:var(--muted);font-weight:600">獲得XP</div>
      <div style="font-size:24px;font-weight:800">+${int(xp)}</div>
      <div style="font-size:11.5px;color:var(--ink-2)">${esc(m.name)} の経験値</div></div>
  </div>`;
}
function recentGrid(mid){
  let dts=[], c=TODAY(), g=0;
  while(dts.length<7 && g++<30){ if(isWorkday(c)) dts.push(c); c=addDays(c,-1); }
  dts.reverse();
  return `<div class="row">${dts.map(dt=>{
    const r=S.records.find(x=>x.date===dt&&x.memberId===mid);
    const ok=r&&((+r.calls||0)>0||(+r.appts||0)>0);
    return `<button class="chip" style="flex-direction:column;padding:8px 12px;line-height:1.35;${ok?'background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,transparent)':''}"
      onclick="inputDate='${dt}';render()">
      <span style="font-size:11px;color:var(--muted)">${jp(dt)}</span>
      <b style="font-size:13px">${ok?`${r.calls}/${r.appts}`:'未入力'}</b></button>`;}).join('')}</div>
  <div class="hint">表示は「架電数/アポ数」。クリックでその日の入力に切り替わります。</div>`;
}
function saveRecord(){
  syncApptDraftFromDOM();
  if(!validate()){ document.getElementById('errSave').scrollIntoView({block:'center'}); return; }
  const calls=+document.getElementById('iCalls').value||0;
  const appts=+document.getElementById('iAppts').value||0;
  const note=document.getElementById('iNote').value.trim();
  const appointments = apptDraft.map(a=>({...blankAppt(), ...a}));

  const beforeXp = xpOf(inputMember), beforeLv = levelOf(beforeXp).level;
  const ex = S.records.find(r=>r.date===inputDate && r.memberId===inputMember);
  if(ex){ Object.assign(ex,{calls,appts,note,appointments,updatedAt:Date.now()}); }
  else { S.records.push({id:uid(),date:inputDate,memberId:inputMember,calls,appts,note,appointments,createdAt:Date.now()}); }
  save(); draftKey='';

  const afterLv = levelOf(xpOf(inputMember)).level;
  if(appts>0) confetti();
  toast(appts>0? `🎉 アポ${appts}件を記録！ +${int(appts*XP_APPT+calls*XP_CALL)}XP` : `💾 ${jp(inputDate)} の実績を保存しました`);
  if(afterLv>beforeLv){
    const r=rankOf(afterLv);
    document.getElementById('luTitle').textContent=`Lv.${afterLv} にレベルアップ！`;
    document.getElementById('luDesc').textContent=`${memberById(inputMember).name} ・ ${r.emoji} ${r.name}`;
    document.getElementById('levelup').classList.add('on');
  }
  render();
}
function deleteRecord(id){
  if(!confirm('この日の記録を削除しますか？')) return;
  S.records=S.records.filter(r=>r.id!==id); save(); toast('🗑 削除しました'); render();
}

/* ---------------- カレンダー ---------------- */
let calMonth = TODAY().slice(0,7);
let calMember = 'all';
function shiftMonth(n){
  const [y,m]=calMonth.split('-').map(Number);
  const t=new Date(y, m-1+n, 1);
  calMonth = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`;
  render();
}
function viewCal(){
  const who = calMember==='all'? null : calMember;
  const [y,mo] = calMonth.split('-').map(Number);
  const first = new Date(y,mo-1,1), last = new Date(y,mo,0);
  const from = `${calMonth}-01`, to = `${calMonth}-${String(last.getDate()).padStart(2,'0')}`;

  const dayRec = new Map();   // 日付 → {calls,appts}
  recs({...(who?{memberId:who}:{}), from, to}).forEach(r=>{
    const o=dayRec.get(r.date)||{calls:0,appts:0,members:new Set()};
    o.calls+=+r.calls||0; o.appts+=+r.appts||0; o.members.add(r.memberId); dayRec.set(r.date,o);
  });
  const dayPlan = new Map(); // 訪問予定日 → [appt]
  allAppointments(who?{memberId:who}:{}).forEach(a=>{
    if(!a.apptAt) return; const dt=a.apptAt.slice(0,10);
    if(dt<from||dt>to) return;
    (dayPlan.get(dt)||dayPlan.set(dt,[]).get(dt)).push(a);
  });

  const monthAgg = agg(recs({...(who?{memberId:who}:{}), from, to}));
  const maxA = Math.max(1, ...[...dayRec.values()].map(o=>o.appts));

  // セル生成（月曜始まり）
  const lead = (first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<lead;i++) cells.push(null);
  for(let dd=1; dd<=last.getDate(); dd++) cells.push(`${calMonth}-${String(dd).padStart(2,'0')}`);
  while(cells.length%7) cells.push(null);

  const memberChips = ['all',...activeMembers().map(m=>m.id)].map(id=>
    `<button class="chip" aria-pressed="${calMember===id}" onclick="calMember='${id}';render()">${id==='all'?'👥 全員':esc(memberById(id).name)}</button>`).join('');

  const missions = (who? [memberById(who)] : activeMembers()).map(missionCard).join('');

  return `
  <div class="row" style="margin:16px 0 10px">${memberChips}</div>
  ${missions}

  <div class="card" style="margin-top:14px">
    <h2>
      <button class="iconbtn" onclick="shiftMonth(-1)">←</button>
      <span style="font-size:17px;color:var(--ink);font-weight:800">${y}年${mo}月</span>
      <button class="iconbtn" onclick="shiftMonth(1)">→</button>
      <button class="btn sec sm" onclick="calMonth='${TODAY().slice(0,7)}';render()">今月</button>
      <span class="spacer"></span>
      <span class="pill">📞 ${int(monthAgg.calls)}件</span>
      <span class="pill">🤝 ${int(monthAgg.appts)}件</span>
      <span class="pill">${pctS(monthAgg.appts,monthAgg.calls)}</span>
      <span class="pill">💰 ${moneyS(monthAgg.gross)}</span>
    </h2>

    <div class="cal">
      ${['月','火','水','木','金','土','日'].map((w,i)=>
        `<div class="cal-h${i===5?' sat':i===6?' sun':''}">${w}</div>`).join('')}
      ${cells.map(dt=>{
        if(!dt) return `<div class="cal-c empty-c"></div>`;
        const o = dayRec.get(dt), plans = dayPlan.get(dt)||[];
        const dow = d(dt).getDay();
        const isToday = dt===TODAY();
        const heat = o&&o.appts>0 ? 0.10+0.45*(o.appts/maxA) : 0;
        return `<div class="cal-c${dow===6?' sat':dow===0?' sun':''}${isToday?' today':''}"
             style="${heat?`background:color-mix(in srgb,var(--s3) ${(heat*100).toFixed(0)}%,var(--surface))`:''}"
             onclick="jumpTo('${dt}')" title="クリックでこの日の実績入力へ">
          <div class="cal-d">${+dt.slice(-2)}${isToday?'<span class="tdot">今日</span>':''}</div>
          ${o? `<div class="cal-v"><span>📞${o.calls}</span><span class="${o.appts?'ap':''}">🤝${o.appts}</span></div>`
             : (isWorkday(dt) && dt<=TODAY() ? `<div class="cal-v miss">未入力</div>` : '')}
          ${plans.map(a=>`<div class="cal-p" title="${esc((a.contact||'')+' '+(a.content||''))}">
              ${a.apptAt.slice(11)||''} ${esc(a.company||'(未入力)')}</div>`).join('')}
        </div>`;
      }).join('')}
    </div>
    <div class="legend" style="margin-top:12px">
      <span><i style="background:color-mix(in srgb,var(--s3) 45%,var(--surface));border:1px solid var(--border)"></i>色が濃いほどアポ獲得数が多い日</span>
      <span><i style="background:var(--s4)"></i>📅 帯は訪問予定（アポ日時）</span>
      <span>📞 架電数 ／ 🤝 アポ獲得数</span>
    </div>
  </div>

  <div class="card">
    <h2>📋 ${y}年${mo}月の記録（データ表）</h2>
    ${calTable(from,to,who)}
  </div>`;
}
function calTable(from,to,who){
  const list = byDate(recs({...(who?{memberId:who}:{}), from, to}));
  if(!list.length) return `<div class="empty">この月の実績はまだありません。カレンダーの日付をクリックすると入力画面に移動します。</div>`;
  let cum=0;
  return `<div class="tablewrap"><table>
    <thead><tr><th>日付</th><th class="num">架電</th><th class="num">アポ</th><th class="num">アポ率</th><th class="num">月内累計アポ</th><th>訪問予定</th></tr></thead>
    <tbody>${list.map(x=>{ cum+=x.appts;
      const plans = allAppointments(who?{memberId:who}:{}).filter(a=>a.date===x.date);
      return `<tr><td>${jpFull(x.date)}</td><td class="num">${int(x.calls)}</td><td class="num">${int(x.appts)}</td>
        <td class="num">${pctS(x.appts,x.calls)}</td><td class="num">${int(cum)}</td>
        <td style="white-space:normal">${plans.map(a=>esc(a.company||'(未入力)')+(a.apptAt?` <span style="color:var(--ink-2)">${esc(apptLabel(a))}</span>`:'')).join('、')}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function jumpTo(dt){ inputDate=dt; if(calMember!=='all') inputMember=calMember; draftKey=''; go('input'); }

/* ---------------- アポ一覧 ---------------- */
let apFilter='all', apMember='all';
function viewAppts(){
  let list = allAppointments(apMember==='all'?{}:{memberId:apMember});
  const up = list.filter(isUpcoming).sort((a,b)=>a.apptAt<b.apptAt?-1:1);
  const done = list.filter(a=>a.apptAt && !isUpcoming(a)).sort((a,b)=>a.apptAt<b.apptAt?1:-1);
  const tbd = list.filter(a=>!a.apptAt);
  const shown = apFilter==='up'? up : apFilter==='done'? done : apFilter==='tbd'? tbd
              : [...up, ...tbd, ...done];

  const memberChips = ['all',...activeMembers().map(m=>m.id)].map(id=>
    `<button class="chip" aria-pressed="${apMember===id}" onclick="apMember='${id}';render()">${id==='all'?'👥 全員':esc(memberById(id).name)}</button>`).join('');
  const fchips = [['all',`すべて (${list.length})`],['up',`📅 今後の予定 (${up.length})`],['done',`実施済 (${done.length})`],['tbd',`日時未定 (${tbd.length})`]].map(([k,l])=>
    `<button class="chip" aria-pressed="${apFilter===k}" onclick="apFilter='${k}';render()">${l}</button>`).join('');

  if(!list.length) return `<div class="card" style="margin-top:16px"><div class="onb">
      <div class="e">📅</div><h3>まだアポの記録がありません</h3>
      <p>アポを獲得したら「実績入力」でアポ獲得数を1以上にすると、会社名・アポ日時・先方担当者・連絡先を記録できます。</p>
      <button class="btn" onclick="go('input')">✍️ 実績入力へ</button></div></div>`;

  return `
  <div class="row" style="margin:16px 0 10px">${memberChips}</div>
  <div class="row" style="margin-bottom:12px">${fchips}</div>

  <div class="card">
    <h2>📅 アポイント一覧<span class="spacer"></span><span class="pill">${shown.length}件表示</span></h2>
    <div class="tablewrap"><table>
      <thead><tr><th>状態</th><th>アポ日時</th><th>会社・学校名</th><th>先方担当者</th><th>電話</th><th>メール</th><th>商談内容</th><th>担当</th><th>獲得日</th><th></th></tr></thead>
      <tbody>${shown.map(a=>{
        const m=memberById(a.memberId);
        const st = !a.apptAt ? `<span class="pill">日時未定</span>`
                 : isUpcoming(a) ? `<span class="pill ok">📅 予定</span>` : `<span class="pill">実施済</span>`;

function weekStart(){ const t=d(TODAY()); const w=(t.getDay()+6)%7; return addDays(TODAY(),-w); }
function buildSummary(mode, who){
  const line='━━━━━━━━━━━━━━';
  const s=S.settings, rateGoal=(s.apptRateGoal*100).toFixed(0);
  const scope = who? [memberById(who)] : activeMembers();
  let from, to, title;
  if(mode==='today'){ from=to=TODAY(); title=`📞 テレアポ日報　${jpFull(TODAY())}`; }
  else if(mode==='week'){ from=weekStart(); to=TODAY(); title=`📞 テレアポ 週次報告　${jp(from)}〜${jp(to)}`; }
  else if(mode==='month'){ from=TODAY().slice(0,7)+'-01'; to=TODAY(); title=`📞 テレアポ 月次報告　${TODAY().slice(0,7).replace('-','年')}月`; }
  else { from=s.periodStart; to=TODAY(); title=`📞 テレアポ 累計報告　${from.replace(/-/g,'/')}〜${to.replace(/-/g,'/')}`; }

  const per = scope.map(m=>({m, ...agg(recs({memberId:m.id, from, to}))}));
  const tot = per.reduce((a,x)=>({calls:a.calls+x.calls, appts:a.appts+x.appts}),{calls:0,appts:0});
  const totRate = pct(tot.appts,tot.calls);

  let out = title+'\n'+line+'\n';
  per.forEach(p=>{
    const dayT=(+p.m.dailyCall||0);
    out += `【${p.m.name}】\n`;
    out += `　📞 架電 ${int(p.calls)}件 ／ 🤝 アポ ${int(p.appts)}件\n`;
    out += `　🎯 アポ率 ${pctS(p.appts,p.calls)}（目標${rateGoal}%）${p.calls? (p.rate>=+rateGoal?' ✅達成':' ⚠未達'):''}\n`;
    if(mode==='today' && dayT) out += `　📋 日次目標 ${dayT}件 → ${p.calls>=dayT?'達成 ✅':`あと${dayT-p.calls}件`}\n`;
    const st=streak(p.m.id); if(st>1) out += `　🔥 ${st}営業日連続で稼働中\n`;
    const mx = missionStats(p.m);
    if(mx){
      out += `　🎯 ${mx.label} ${int(mx.got)}/${mx.target}件（${mx.ratio.toFixed(0)}%）期限 ${jpFull(mx.to)}\n`;
      out += mx.done ? `　　└ 🎉 達成済み\n`
           : mx.overdue ? `　　└ ⏰ 期限超過・残${int(mx.remain)}件\n`
           : `　　└ 残${int(mx.remain)}件／残${mx.leftDays}営業日 → 1日${fine(mx.perDay)}件ペース（${mx.diff>=0?'✅予定どおり':`⚠${fmt(Math.abs(mx.diff))}件ビハインド`}）\n`;
    }
    allAppointments({memberId:p.m.id, from, to}).forEach(a=>{
      const bits=[a.company||'(社名未入力)'];
      if(a.apptAt) bits.push(`📅 ${apptLabel(a)}`);
      if(a.contact) bits.push(a.contact);
      out += `　📍 ${bits.join(' ／ ')}\n`;
      if(a.content) out += `　　└ ${a.content}\n`;
    });
  });
  if(per.length>1){
    out += line+'\n【チーム合計】\n';
    out += `　📞 架電 ${int(tot.calls)}件 ／ 🤝 アポ ${int(tot.appts)}件（${pctS(tot.appts,tot.calls)}）\n`;
  }

  // 累計パート
  const A = agg(recs(who?{memberId:who}:{}));
  const remain = Math.max(0, s.apptGoal - A.appts);
  out += line+'\n';
  out += `📊 累計（${s.periodStart.replace(/-/g,'/')}〜）\n`;
  out += `　架電 ${int(A.calls)}件 ／ アポ ${int(A.appts)}件（アポ率 ${pctS(A.appts,A.calls)}）\n`;
  out += `　🎯 目標 ${s.apptGoal}件に対し ${pct(A.appts,s.apptGoal).toFixed(1)}%・残り ${int(remain)}件\n`;
  out += `　💰 想定粗利 ${moneyS(A.gross)}（成約${(s.closeRate*100).toFixed(0)}%×${s.unitsPerDeal}台×${int(s.grossPerUnit)}円）\n`;
  if(remain>0) out += `　📈 残アポ${int(remain)}件に必要な架電 約${int(Math.ceil(remain/s.apptRateGoal))}件\n`;
  const xp=xpOf(who), L=levelOf(xp), r=rankOf(L.level);
  out += `　${r.emoji} Lv.${L.level} ${r.name}（${int(xp)}XP）\n`;
  const nb = BADGES.filter(b=>b.f(badgeStats(who)));
  if(nb.length) out += `　🎖 称号 ${nb.length}/${BADGES.length}：${nb.slice(-3).map(b=>b.e+b.n).join(' ')}\n`;

  const up = allAppointments(who?{memberId:who}:{}).filter(isUpcoming)
              .sort((a,b)=>a.apptAt<b.apptAt?-1:1).slice(0,5);
  if(up.length){
    out += line+'\n📅 今後のアポ予定\n';
    up.forEach(a=>{ out += `　${apptLabel(a)}　${a.company}${a.contact?`（${a.contact}）`:''}\n`; });
  }
  return out;
}

    const names=(r.appointments||[]).map(a=>a.company||'(未入力)').join(' / ');
    rows.push([r.date, WD[d(r.date).getDay()], m.name, m.kind||'', +r.calls||0, +r.appts||0,
      +(pct(r.appts,r.calls).toFixed(1)), +deals(r.appts).toFixed(2), Math.round(gross(r.appts)), names, r.note||'']);
  });
  return rows;
}
function tableAppts(){
  const rows=[['獲得日','担当者','会社・学校名','アポ日時','先方担当者名','電話','メールアドレス','商談内容・メモ','ステータス']];
  allAppointments().sort((a,b)=> (a.apptAt||a.date) < (b.apptAt||b.date) ? -1 : 1).forEach(a=>{
    rows.push([a.date, memberById(a.memberId).name, a.company||'', (a.apptAt||'').replace('T',' '),
      a.contact||'', a.tel||'', a.email||'', a.content||'',
      !a.apptAt ? '日時未定' : (isUpcoming(a) ? '予定' : '実施済')]);
  });
  return rows;
}
function tableDaily(){
  const rows=[['日付','曜日','架電数','アポ数','アポ率(%)','累計アポ数','想定粗利(円)']];
  let cum=0;
  byDate(S.records).forEach(x=>{ cum+=x.appts;
    rows.push([x.date, WD[d(x.date).getDay()], x.calls, x.appts, +(pct(x.appts,x.calls).toFixed(1)), cum, Math.round(gross(x.appts))]); });
  return rows;
}
function tableMember(){
  const rows=[['担当者','区分','稼働日数','架電数','アポ数','アポ率(%)','想定成約数','想定粗利(円)','レベル','XP']];
  S.members.forEach(m=>{ const a=agg(recs({memberId:m.id})); if(!a.calls&&!a.appts) return;
    const xp=xpOf(m.id);
    rows.push([m.name, m.kind||'', a.days, a.calls, a.appts, +(a.rate.toFixed(1)), +a.deals.toFixed(2), Math.round(a.gross), levelOf(xp).level, xp]); });
  return rows;
}
function tableMonthly(){
  const rows=[['月','稼働日数','架電数','アポ数','アポ率(%)','想定成約数','想定粗利(円)']];
  const m=new Map();
  S.records.forEach(r=>{ const k=r.date.slice(0,7); const o=m.get(k)||{calls:0,appts:0,days:new Set()};
    o.calls+=+r.calls||0; o.appts+=+r.appts||0; o.days.add(r.date); m.set(k,o); });
  [...m.entries()].sort().forEach(([k,o])=>rows.push([k,o.days.size,o.calls,o.appts,+(pct(o.appts,o.calls).toFixed(1)),+deals(o.appts).toFixed(2),Math.round(gross(o.appts))]));
  const t=[...m.values()].reduce((a,o)=>({c:a.c+o.calls,p:a.p+o.appts,d:a.d+o.days.size}),{c:0,p:0,d:0});
  rows.push(['合計',t.d,t.c,t.p,+(pct(t.p,t.c).toFixed(1)),+deals(t.p).toFixed(2),Math.round(gross(t.p))]);
  return rows;
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{ const s=String(c??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\r\n');
}
function exportCSV(kind){
  const appt = kind==='appt';
  dl(new Blob(['﻿'+toCSV(appt?tableAppts():tableDetail())],{type:'text/csv;charset=utf-8'}),
     `テレアポKPI_${appt?'アポ一覧':'明細'}_${stamp()}.csv`);
  toast('📄 CSVを書き出しました');
}
function exportJSON(){
  dl(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}), `テレアポKPI_バックアップ_${stamp()}.json`);
  toast('💾 バックアップを保存しました');
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      if(!p || !Array.isArray(p.records)) throw new Error('形式が違います');
      const mode = confirm('OK：既存データに統合（同じ日付・同じ担当者は新しい方で上書き）\nキャンセル：完全に置き換え');
      if(mode){
        // メンバーを名前基準でマージ
        (p.members||[]).forEach(pm=>{ if(!S.members.find(m=>m.id===pm.id||m.name===pm.name)) S.members.push(pm); });
        p.records.forEach(r=>{
          const mid = S.members.find(m=>m.id===r.memberId)?.id
                   || S.members.find(m=>m.name===(p.members||[]).find(x=>x.id===r.memberId)?.name)?.id
                   || r.memberId;
          const ex=S.records.find(x=>x.date===r.date && x.memberId===mid);
          if(ex){ if((r.updatedAt||r.createdAt||0) >= (ex.updatedAt||ex.createdAt||0)) Object.assign(ex,{calls:r.calls,appts:r.appts,detail:r.detail,note:r.note,updatedAt:r.updatedAt||Date.now()}); }
          else S.records.push({...r, id:uid(), memberId:mid});
        });
      } else {
        S = {settings:{...DEFAULTS.settings,...(p.settings||{})}, members:p.members||S.members, records:p.records, meta:p.meta||{}};
      }
      save(); render(); toast('📥 読み込みました（'+p.records.length+'件）');
    }catch(e){ alert('読み込みに失敗しました：'+e.message); }
    inp.value='';
  };
  fr.readAsText(f);
}

/* ---------- 最小xlsxライター（無圧縮ZIP・外部ライブラリ不要） ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRC_T[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const ENC=new TextEncoder();
function zip(files){ // files: [{name, data:Uint8Array}]
  const chunks=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const nm=ENC.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    chunks.push(lh,nm,f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]));
    central.push(nm);
    off += lh.length+nm.length+sz;
  });
  const cdStart=off; let cdSize=0; central.forEach(c=>cdSize+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdSize),...u32(cdStart),...u16(0)]);
  const total=[...chunks,...central,end];
  let len=0; total.forEach(c=>len+=c.length);
  const out=new Uint8Array(len); let p=0; total.forEach(c=>{out.set(c,p);p+=c.length;});
  return out;
}
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26);} return s; }
function xmlEsc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])); }
function sheetXML(rows){
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`;
  rows.forEach((row,ri)=>{
    x+=`<row r="${ri+1}">`;
    row.forEach((cell,ci)=>{
      const ref=colLetter(ci+1)+(ri+1);
      if(typeof cell==='number' && isFinite(cell)) x+=`<c r="${ref}" s="${ri===0?1:0}"><v>${cell}</v></c>`;
      else x+=`<c r="${ref}" s="${ri===0?1:0}" t="inlineStr"><is><t>${xmlEsc(cell??'')}</t></is></c>`;
    });
    x+=`</row>`;
  });
  return x+`</sheetData></worksheet>`;
}
function exportXLSX(){
  const sheets=[
    {name:'明細',     rows:tableDetail()},
    {name:'アポ一覧', rows:tableAppts()},
    {name:'日次集計', rows:tableDaily()},
    {name:'メンバー別',rows:tableMember()},
    {name:'月次',     rows:tableMonthly()}
  ];
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${
    sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${
    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2A78D6"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs>
<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" fillId="2" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`;
  const files=[
    {name:'[Content_Types].xml', data:ENC.encode(ct)},
    {name:'_rels/.rels', data:ENC.encode(rels)},
    {name:'xl/workbook.xml', data:ENC.encode(wb)},
    {name:'xl/_rels/workbook.xml.rels', data:ENC.encode(wbRels)},
    {name:'xl/styles.xml', data:ENC.encode(styles)},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`, data:ENC.encode(sheetXML(s.rows))}))
  ];
  dl(new Blob([zip(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `テレアポKPI_${stamp()}.xlsx`);
  toast('📊 Excelファイルを書き出しました');
}

/* =========================================================================
   演出
   ========================================================================= */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600);
}
function confetti(){
  const cols=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
  for(let i=0;i<70;i++){
    const e=document.createElement('i'); e.className='cf';
    e.style.left=Math.random()*100+'vw';
    e.style.background=cols[i%4];
    e.style.animation=`fall ${1.6+Math.random()*1.4}s cubic-bezier(.25,.6,.4,1) ${Math.random()*.5}s forwards`;
    document.body.appendChild(e); setTimeout(()=>e.remove(),3800);
  }
}

document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? '' : 'dark';
  if(next) document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem(LS_KEY+'_theme', next);
  render();
};
